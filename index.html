   Identity: near-black violet night, an ember→pink gradient used only for the logo, primary actions and active states; wide geometric display face (Unbounded) for the brand voice, Manrope for reading. */
:root{
  --accent:#FF8A00; --accent2:#FFB347; --accent-b:#FF3D7F; --on-accent:#FFFFFF;
  --grad:linear-gradient(120deg,var(--accent),var(--accent-b));
  --bg:#09090F; --bg2:#0F0F18; --card:#13131E; --card2:#1B1B29; --line:#232338; --line2:#34344F;
  --fg:#F4F3FA; --fg2:#ABA9C3; --fg3:#787691;
  --up:#2FD9A0; --down:#FF5C6C; --warn:#F5B84A; --blue:#7C8CFF;
  --up-bg:rgba(62,207,148,.12); --down-bg:rgba(255,107,94,.12); --acc-bg:rgba(255,138,0,.12); --acc-line:rgba(255,138,0,.4);
  --f0:#FF6B5E; --f1:#F39A5B; --f2:#9AA3B6; --f3:#A6D36F; --f4:#3ECF94;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 32px rgba(3,6,15,.35);
  --display:'Unbounded','Manrope',system-ui,sans-serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px; --r2:12px; --fs:15px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --on-accent:#fff;
  --bg:#F6F5FB; --bg2:#EEEDF6; --card:#FFFFFF; --card2:#F5F4FA; --line:#E4E2EF; --line2:#CFCCE0; --blue:#4B5BDB;
  --fg:#14121F; --fg2:#4A4763; --fg3:#75728E;
  --up:#0B9A68; --down:#DC3F33; --warn:#B87900;
  --up-bg:rgba(11,154,104,.1); --down-bg:rgba(220,63,51,.09);
  --f0:#DC3F33; --f1:#D9772F; --f2:#7C869D; --f3:#6FA132; --f4:#0B9A68;
  --shadow:0 1px 2px rgba(17,23,38,.05),0 10px 26px rgba(17,23,38,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased;
  background:var(--bg);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 460px at 0% -10%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 70%),radial-gradient(800px 420px at 100% -5%,color-mix(in srgb,var(--accent-b) 12%,transparent),transparent 70%);transform:translateZ(0)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--fg2)}
.muted{color:var(--fg2)} .dim{color:var(--fg3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.02em;text-wrap:balance;margin:0}
.grad-t{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1240px;margin:0 auto;padding:10px 20px 0;display:flex;flex-direction:column;gap:8px}
.hdr-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);margin-right:auto}
.logo{flex:none;width:40px;height:40px;filter:drop-shadow(0 6px 14px color-mix(in srgb,var(--accent-b) 35%,transparent));transition:transform .25s}
.brand:hover .logo{transform:rotate(-8deg) scale(1.05)}
.brand-t{display:flex;flex-direction:column;line-height:1.05}
.brand-t b{font-family:var(--display);font-weight:500;font-size:18px;letter-spacing:-.03em}
.brand-t b i{font-style:normal;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-left:1px}
.brand-t small{font-size:11.5px;color:var(--fg3);font-weight:600}
.clock{font-weight:700;font-size:14px;color:var(--fg2);white-space:nowrap}
.clock span{color:var(--fg3);font-weight:600;font-size:12px;margin-left:6px}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--fg2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.25)}
:root[data-theme="light"] .seg button.on{box-shadow:0 1px 3px rgba(17,23,38,.15)}
.icon-btn{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);display:inline-grid;place-items:center;cursor:pointer;color:var(--fg2);position:relative;flex:none}
.icon-btn:hover{color:var(--fg);border-color:var(--line2)}
.icon-btn svg{width:17px;height:17px}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sdot{position:absolute;right:2px;top:2px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg);background:var(--fg3)}
.sdot.ok{background:var(--up)} .sdot.err{background:var(--down)} .sdot.stale{background:var(--warn)}
.tabsnav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabsnav::-webkit-scrollbar{display:none}
.tabsnav a{flex:none;display:flex;align-items:center;gap:7px;padding:9px 12px 11px;color:var(--fg2);text-decoration:none;font-weight:700;font-size:13.5px;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabsnav a svg{width:16px;height:16px;opacity:.85}
.tabsnav a:hover{color:var(--fg)}
.tabsnav a{position:relative}
.tabsnav a.on{color:var(--fg)}
.tabsnav a.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px;background:var(--grad)}
.tabsnav a.on svg{color:var(--accent);opacity:1}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:min(360px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line2);border-radius:var(--r2);padding:12px;box-shadow:var(--shadow);z-index:60;font-size:13px}
.pop .row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.pop .row:last-child{border:0}
.pop .row span:nth-child(2){flex:1}

/* ---------- bottom nav (phone) ---------- */
.bnav{display:none}
.sheet-bg{position:fixed;inset:0;background:rgba(5,8,16,.55);z-index:90;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line2);max-height:85vh;overflow:auto}
.sheet h3{font-size:16px;margin:2px 4px 10px}
.sheet-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sheet-grid a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:12.5px;font-weight:700;text-align:center}
.sheet-grid a svg{width:22px;height:22px;color:var(--accent)}

/* ---------- page ---------- */
main{max-width:1240px;margin:0 auto;padding:22px 20px 60px;display:flex;flex-direction:column;gap:18px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{font-size:clamp(26px,3.2vw,34px);font-weight:750}
.ph p{margin:4px 0 0;color:var(--fg2);max-width:68ch}
.lead{font-size:16px;color:var(--fg);max-width:70ch;margin:0}
.lead b{color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--fg2);padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer}
.tabs button:hover{color:var(--fg);border-color:var(--line2)}
.tabs button.on{background:var(--grad);border-color:transparent;color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:18px;font-weight:700}
.card-h h3{font-size:15px;font-weight:700}
.card-h .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.src{font-size:12px;color:var(--fg3);margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.src a{color:var(--fg3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--card2);color:var(--fg);padding:8px 14px;border-radius:999px;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--fg3)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--accent-b) 28%,transparent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.big{padding:13px 22px;font-size:15.5px}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn.ghost{background:none;border-color:transparent;color:var(--fg2)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn.danger{color:var(--down);border-color:color-mix(in srgb,var(--down) 50%,transparent);background:none}
.btn:disabled{opacity:.55;cursor:wait}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:999px;white-space:nowrap;text-transform:uppercase}
.badge.live{background:var(--up-bg);color:var(--up)}
.badge.delayed{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.badge.neutral{background:var(--card2);color:var(--fg2);border:1px solid var(--line)}
.badge.fact{background:var(--card2);color:var(--fg);border:1px solid var(--line2)}
.badge.interp{background:none;color:var(--accent);border:1px dashed var(--acc-line)}
.badge.ai{background:var(--acc-bg);color:var(--accent)}
.ldot{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(62,207,148,.5);animation:pl 2s infinite}
@keyframes pl{70%{box-shadow:0 0 0 6px rgba(62,207,148,0)}100%{box-shadow:0 0 0 0 rgba(62,207,148,0)}}
.empty{padding:22px 8px;text-align:center;color:var(--fg3);font-size:14px}
.err{padding:14px;border-radius:12px;border:1px dashed var(--line2);color:var(--fg2);font-size:13.5px}
.err b{color:var(--down);display:block;margin-bottom:2px}
.help{margin-top:10px;font-size:13.5px}
.help summary{cursor:pointer;color:var(--fg3);font-weight:700;list-style:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.help summary::-webkit-details-marker{display:none}
.help summary::before{content:"?";display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1.5px solid currentColor;font-size:11px;font-weight:800}
.help[open] summary{color:var(--accent)}
.help p{margin:6px 0 0;color:var(--fg2);max-width:70ch}

/* ---------- hero ---------- */
.today{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);border-radius:24px;overflow:hidden;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.today-hi{position:relative;overflow:hidden;padding:28px 28px 26px;display:flex;flex-direction:column;gap:14px;background:radial-gradient(420px 260px at 0% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),radial-gradient(420px 300px at 100% 100%,color-mix(in srgb,var(--accent-b) 18%,transparent),transparent 70%),var(--card)}
.today-hi .wm{position:absolute;right:-46px;bottom:-40px;width:230px;height:230px;opacity:.07;pointer-events:none;transform:rotate(-12deg)}
.today-hi>*{position:relative}
.today-hi .eyebrow{font-size:13px;font-weight:700;color:var(--fg2);margin:0}
.today-hi .eyebrow::first-letter{text-transform:uppercase}
.snap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.snap a{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--line);text-decoration:none;color:var(--fg);min-width:0}
.snap a:hover{border-color:var(--line2)}
.snap .k{font-size:11.5px;font-weight:700;color:var(--fg3)}
.snap .v{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snap .s{font-size:12px;font-weight:700}
.today-hi h1{font-size:clamp(34px,4.6vw,52px);font-weight:800;line-height:1.02;letter-spacing:-.04em}
.today-hi h1 i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.today-hi .mood{font-size:16px;line-height:1.55;margin:0;max-width:52ch}
.today-hi .mood b{font-weight:800}
.today-hi .chips{margin:0}
.today-list{padding:20px 22px 14px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.today-list .card-h{margin-bottom:8px}
.tl-box{position:relative;max-height:440px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;margin-right:-10px;padding-right:10px;scrollbar-width:thin}
.tl-more{display:block;width:100%;margin:2px 0 4px;padding:9px 12px;border-radius:12px;border:1px dashed var(--line2);background:none;color:var(--fg2);font:700 13px/1.2 var(--sans);cursor:pointer;text-align:center}
.tl-more:active{transform:scale(.98)}
.ev{display:grid;grid-template-columns:48px 30px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.ev:last-child{border-bottom:0}
.ev .tm{font-weight:800;font-size:14px;padding-top:4px}
.ev .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line)}
.ev .ic svg{width:15px;height:15px}
.ev .ic.cal{color:var(--accent);background:var(--acc-bg);border-color:var(--acc-line)}
.ev .ic.mkt{color:var(--blue)}
.ev .ic.news{color:var(--fg2)}
.ev .ic.social{color:var(--accent-b)}
.ev .ic.fng{color:var(--up)}
.ev .ic.alert{color:var(--warn)}
.ev .tx{min-width:0;font-weight:700;font-size:14px;line-height:1.38;padding-top:4px}
.ev .tx small{display:block;font-weight:600;color:var(--fg3);font-size:12px;margin-top:2px}
.ev .rt{padding-top:4px;text-align:right}
.ev.past .tm,.ev.past .tx{color:var(--fg2)}
.ev.past .tx{font-weight:600}
a.ev:hover .tx{color:var(--accent)}
.now-line{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--accent-b)}
.now-line::before,.now-line::after{content:"";height:2px;flex:1;border-radius:2px;background:var(--grad)}
.now-line::before{flex:0 0 14px}
.mks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:22px}
.mk{padding:12px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);min-width:0;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:3px}
.mk:hover{border-color:var(--line2)}
.mk.hl{border-color:var(--acc-line);background:radial-gradient(260px 120px at 0% 0%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),var(--bg2)}
.mk-h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mk-h b{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk .lbl{font-size:12px;font-weight:700;color:var(--fg3)}
.mk .cd{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.mk small{font-size:11.5px;color:var(--fg3);font-weight:600}
.ny-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-size:12.5px;font-weight:700;color:var(--fg2);text-decoration:none;white-space:nowrap}
.ny-chip:hover{border-color:var(--line2);color:var(--fg)}
.ny-chip .cd{font-size:12.5px}
.ny-chip i{width:7px;height:7px;border-radius:50%;background:var(--fg3)}
.ny-chip i.on{background:var(--up);box-shadow:0 0 0 3px var(--up-bg)}
.next-big{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px dashed var(--line2);font-size:13px;color:var(--fg2)}
.next-big b{color:var(--fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--line);font-size:13px;font-weight:700}
:root[data-theme="light"] .chip{background:rgba(255,255,255,.7)}
.chip .k{color:var(--fg3);font-weight:600}
.hero-side{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.hero-side .lbl{font-size:13px;font-weight:700;color:var(--fg2)}

/* ---------- coin cards ---------- */
.coins{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.cc{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--fg);box-shadow:var(--shadow);min-width:0;transition:border-color .15s,transform .15s}
.cc:hover{border-color:var(--line2);transform:translateY(-1px)}
.cc-top{display:flex;align-items:center;gap:8px;min-width:0}
.cc-top img{width:24px;height:24px;border-radius:50%;flex:none}
.cc-top b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-top .sym{color:var(--fg3);font-weight:700;font-size:12px}
.cc-top .badge{margin-left:auto}
.cc-price{font-size:26px;font-weight:800;letter-spacing:-.02em;transition:color .6s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-price.tu{color:var(--up)} .cc-price.td{color:var(--down)}
.cc-chg{font-weight:700;font-size:13.5px}
.cc .spark{height:34px;margin-top:2px}
.add-card{display:grid;place-items:center;border:1.5px dashed var(--line2);border-radius:var(--r);color:var(--fg2);text-decoration:none;font-weight:700;min-height:150px;background:none}
.add-card:hover{color:var(--accent);border-color:var(--accent)}

/* ---------- tiles ---------- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 2px -4px}
.sec-h h2{font-size:21px;font-weight:750}
.sec-h a{font-weight:700;font-size:13.5px;text-decoration:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--fg);box-shadow:var(--shadow);min-height:140px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--acc-line);transform:translateY(-2px)}
.tile-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--grad);color:#fff;margin-bottom:4px;box-shadow:0 6px 16px color-mix(in srgb,var(--accent-b) 22%,transparent)}
.tile-ic svg{width:21px;height:21px}
.tile-t{font-family:var(--display);font-weight:750;font-size:18px}
.tile-p{font-weight:700;font-size:14px;color:var(--fg);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile-d{font-size:13px;color:var(--fg3)}
.tile .arr{position:absolute;right:16px;top:18px;color:var(--fg3)}

/* ---------- stats ---------- */
.stat{padding:16px;border-radius:var(--r2);background:var(--card);border:1px solid var(--line);min-width:0}
.stat .k{font-size:12.5px;font-weight:700;color:var(--fg2);display:flex;justify-content:space-between;gap:6px;align-items:center}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:13px;font-weight:600;margin-top:2px}
.stat .help{margin-top:6px}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start;min-width:0}
.li:last-child{border-bottom:0}
.li-m{min-width:0;flex:1}
.li .t{font-weight:700;color:var(--fg);text-decoration:none;line-height:1.4;display:block}
.li a.t:hover{color:var(--accent)}
.li .d{color:var(--fg2);font-size:13.5px;margin-top:3px}
.li .meta{font-size:12.5px;color:var(--fg3);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--fg2);border:1px solid var(--line)}
.tag.hot{color:var(--accent);border-color:var(--acc-line);background:var(--acc-bg)}
.when{min-width:52px;font-weight:800;font-size:14px}
.cd{font-weight:800;font-size:13px;color:var(--accent);white-space:nowrap}
.imp{display:inline-flex;gap:2px;vertical-align:middle}
.imp i{width:6px;height:11px;border-radius:2px;background:var(--line2)}
.imp.l3 i{background:var(--accent)} .imp.l2 i:nth-child(-n+2){background:var(--accent2)} .imp.l1 i:first-child{background:var(--fg3)}

/* brief */
.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.blist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:14.5px}
.blist li small{display:block;color:var(--fg3);font-size:12px}
.blist li .badge{margin-top:2px}
.bsec h3{font-size:13px;font-family:var(--sans);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);margin:0 0 10px}

/* movers / leaderboard */
.lb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.lb h3{font-size:15px;font-weight:750;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.lbr{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lbr:last-child{border:0}
.lbr .rk{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--card2);font-weight:800;font-size:12.5px;color:var(--fg2)}
.lbr .nm{min-width:0}
.lbr .nm b{font-weight:800}
.lbr .nm small{display:block;color:var(--fg3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip{font-weight:800;font-size:14px;padding:5px 10px;border-radius:10px;min-width:86px;text-align:right}
.pchip.up{background:var(--up-bg)} .pchip.down{background:var(--down-bg)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-r{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13.5px}
.bar-r>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bar{height:10px;background:var(--card2);border-radius:5px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:5px}
.breadth{height:14px;border-radius:7px;overflow:hidden;display:flex;background:var(--card2)}
.breadth i{display:block;height:100%}

/* tables */
.tw{overflow-x:auto;margin:0 -6px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:right;font-weight:700;font-size:12px;color:var(--fg3);padding:9px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.t th.s{cursor:pointer} table.t th.s:hover{color:var(--fg)} table.t th.on{color:var(--accent)}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:nth-child(-n+2),table.t td:nth-child(-n+2){text-align:left}
table.t tr:hover td{background:color-mix(in srgb,var(--fg) 3%,transparent)}
.coin{display:flex;align-items:center;gap:9px;color:var(--fg);text-decoration:none;font-weight:700}
.coin img{width:22px;height:22px;border-radius:50%}
.coin small{color:var(--fg3);font-weight:600}
.star{background:none;border:0;cursor:pointer;color:var(--fg3);font-size:17px;padding:2px 4px;line-height:1}
.star.on{color:var(--accent)}

/* chart */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%}
.chart .tip{position:absolute;pointer-events:none;background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:6px 10px;font-size:12.5px;white-space:nowrap;z-index:5;box-shadow:var(--shadow)}
.chart .tip b{color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--fg2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* fng */
.fng-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}
.fstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fstat{padding:12px 14px;border-radius:var(--r2);background:var(--bg2);border:1px solid var(--line)}
.fstat small{display:block;font-size:12px;font-weight:700;color:var(--fg3)}
.fstat b{font-size:24px;font-weight:800}
.fstat span{display:block;font-size:12.5px;color:var(--fg2);font-weight:600}

/* timeline */
.tl{--tlw:160px}
.tl-row{display:grid;grid-template-columns:var(--tlw) minmax(0,1fr);gap:10px;align-items:center;height:30px}
.tl-row .lab{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-track{position:relative;height:14px;background:var(--bg2);border-radius:7px}
.tl-track i{position:absolute;top:0;bottom:0;border-radius:7px;background:var(--line2)}
.tl-track i.cur{background:var(--accent)}
.tl-track i.ext{background:repeating-linear-gradient(45deg,var(--line2) 0 4px,transparent 4px 8px)}
.tl-track i.hot{background:var(--acc-bg);border:1.5px solid var(--acc-line)}
.tl-axis{display:grid;grid-template-columns:var(--tlw) minmax(0,1fr);gap:10px;font-size:11.5px;color:var(--fg3);font-weight:600}
.tl-axis div{position:relative;height:18px}
.tl-axis div span{position:absolute;transform:translateX(-50%)}
.tl-now{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--accent);border-radius:2px}
.tl-now::after{content:attr(data-t);position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:800;color:var(--accent);white-space:nowrap}

/* forms */
.form{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0;max-width:100%}
.fld label{font-size:12.5px;font-weight:700;color:var(--fg2)}
.inp{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-size:14px;min-width:0;max-width:100%;color:var(--fg)}
.inp:focus{border-color:var(--accent);outline:none}
.set-row{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set-row:last-child{border:0}
.set-row .l{flex:1 1 240px;min-width:0}
.set-row .l b{display:block;font-weight:700}
.set-row .l small{color:var(--fg3);font-size:12.5px;display:block;margin-top:2px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;padding:4px 0}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--fg2)}
.fchips button.on{border-color:var(--accent);color:var(--accent);background:var(--acc-bg)}
.swatches{display:flex;gap:8px}
.swatches{flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid var(--card);outline:2px solid transparent;cursor:pointer}
.swatches button.on{outline-color:var(--fg)}
.order{display:flex;flex-direction:column;gap:6px}
.order-r{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
.order-r span{flex:1;font-weight:700;font-size:14px}
.order-r .btn{padding:3px 9px}
.qres{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1px solid var(--line2);border-radius:12px;max-height:60vh;overflow:auto;box-shadow:var(--shadow);z-index:70}
.qres a{display:flex;gap:10px;align-items:center;padding:10px 12px;color:var(--fg);border-bottom:1px solid var(--line);font-size:14px;text-decoration:none}
.qres a:hover{background:var(--card2)}
.qres .k{font-size:11px;font-weight:800;color:var(--fg3);text-transform:uppercase;min-width:62px}

/* glossary */
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.gloss .card h3{font-size:17px;margin-bottom:6px}
.gloss .card p{margin:0;color:var(--fg2)}

/* modal / toast / banner */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,16,.62);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:max(5vh,calc(env(safe-area-inset-top,0px) + 16px)) 16px 16px;overflow-y:auto}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:22px;width:min(760px,100%);padding:26px 26px 24px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-h h2{font-size:clamp(30px,5vw,42px);font-weight:800;letter-spacing:-.03em}
.modal-h p{margin:4px 0 0;color:var(--fg2);font-size:13.5px}
.md{font-size:15px;line-height:1.65}
.md h3{font-family:var(--sans);font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:20px 0 8px;font-weight:800}
.md p{margin:6px 0}
.md ul{margin:6px 0;padding-left:20px}
.md li{margin:4px 0}
.outlook{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.outlook .fstat{flex:1 1 160px}
.note{font-size:12.5px;color:var(--fg3);border-top:1px solid var(--line);padding-top:12px;margin-top:16px}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:200;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--card2);border:1px solid var(--acc-line);border-radius:14px;padding:12px 14px;font-size:14px;box-shadow:var(--shadow)}
.toast b{display:block;color:var(--accent);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.banner{border-radius:14px;padding:14px 16px;background:color-mix(in srgb,var(--warn) 12%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);font-size:14px}
.banner b{display:block;margin-bottom:2px}
.xlinks{display:flex;gap:8px;flex-wrap:wrap}
.xlinks a{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line2);border-radius:999px;background:var(--bg2);color:var(--fg);font-size:13px;font-weight:700;text-decoration:none}
.xlinks a:hover{border-color:var(--accent)}

/* trading + course */
.tr-ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.tr-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:18px;align-items:start}
.tr-chart{min-height:320px}
.kv{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv .k{font-size:12px;font-weight:800;color:var(--fg3);text-transform:uppercase;letter-spacing:.05em}
.kv .v{font-weight:800;font-size:17px}
.kv .s{font-size:13px;color:var(--fg2)}
.setup{border-radius:14px;padding:14px;border:1px solid var(--line2);background:var(--bg2)}
.setup.long{border-color:color-mix(in srgb,var(--up) 45%,transparent);background:linear-gradient(180deg,var(--up-bg),transparent 70%),var(--bg2)}
.setup.short{border-color:color-mix(in srgb,var(--down) 45%,transparent);background:linear-gradient(180deg,var(--down-bg),transparent 70%),var(--bg2)}
.setup-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.setup-g{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.setup-g span{color:var(--fg3);font-weight:700}
.setup-g small{font-size:11.5px;color:var(--fg3);font-weight:600}
.cf{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.cf li::before{content:"✓ ";color:var(--up);font-weight:800}
.cf li.neu::before{content:"• ";color:var(--fg3)}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-weight:600}
.plan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.plan .fld .inp{width:100%}
.chk-l{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;font-size:13.5px;font-weight:600}
.chk-l .ok{color:var(--up)} .chk-l .bad{color:var(--down)} .chk-l .na{color:var(--fg3)}
.okbox{border-radius:14px;background:var(--up-bg);border:1px solid color-mix(in srgb,var(--up) 45%,transparent);font-size:14px;font-weight:600}
.mod-n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--grad);color:#fff;font-size:13px;margin-right:10px;vertical-align:2px}
.lessons{display:flex;flex-direction:column;gap:8px}
.lesson{border:1px solid var(--line);border-radius:14px;background:var(--bg2)}
.lesson[open]{border-color:var(--line2)}
.lesson summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none;font-weight:700}
.lesson summary::-webkit-details-marker{display:none}
.lesson .lt{flex:1}
.lesson .chev{color:var(--fg3);font-size:20px;transition:transform .15s}
.lesson[open] .chev{transform:rotate(90deg)}
.lnum{min-width:34px;height:26px;padding:0 6px;border-radius:8px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--fg2);flex:none}
.qchip{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.qchip.ok{background:var(--up-bg);color:var(--up)} .qchip.part{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)} .qchip.none{color:var(--fg3);border:1px solid var(--line)}
.mcount{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700}
.mbar{width:90px;height:7px;border-radius:4px;background:var(--card2);overflow:hidden;display:block}
.mbar i{display:block;height:100%;background:var(--grad);border-radius:4px}
.cprog{position:relative;overflow:hidden}
.cprog.done{border-color:color-mix(in srgb,var(--up) 45%,transparent)}
.cprog-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cprog-t{font-family:var(--display);font-weight:700;font-size:18px}
.cprog-n{font-family:var(--display);font-weight:800;font-size:38px;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cprog-n span{font-size:20px}
.cbar{height:14px;border-radius:7px;background:var(--card2);overflow:hidden;margin-top:12px}
.cbar i{display:block;height:100%;background:var(--grad);border-radius:7px;transition:width .5s}
.quiz{margin:4px 16px 16px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.qz-start{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qz-head{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);margin-bottom:8px}
.qq{border:0;margin:0 0 14px;padding:0}
.qq legend{font-weight:800;font-size:14.5px;margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.qn{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:7px;background:var(--grad);color:#fff;font-size:12px;flex:none}
.qo{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);margin-bottom:6px;cursor:pointer;font-size:14px}
.qo:hover{border-color:var(--line2)}
.qo input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.qo.sel{border-color:var(--acc-line);background:var(--acc-bg)}
.qo.correct{border-color:color-mix(in srgb,var(--up) 60%,transparent);background:var(--up-bg)}
.qo.miss{border-color:color-mix(in srgb,var(--down) 60%,transparent);background:var(--down-bg)}
.qz-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.qz-res{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:12px;margin-bottom:10px;font-size:14px}
.qz-res.ok{background:var(--up-bg);border:1px solid color-mix(in srgb,var(--up) 45%,transparent)}
.qz-res.bad{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.qz-score{font-family:var(--display);font-weight:800;font-size:28px;min-width:84px}
.qz-res.ok .qz-score{color:var(--up)} .qz-res.bad .qz-score{color:var(--warn)}
.lesson-b{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;padding:0 16px 6px}
.lesson-txt{max-width:70ch}
.lesson-fig{width:300px;max-width:100%}
.fig{width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
.lesson-f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 16px 14px;flex-wrap:wrap}
.term{padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.term b{display:block;font-size:14px}
.term p{margin:2px 0 0;font-size:13px;color:var(--fg2)}
.ak-steps{margin:14px 0 4px;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--fg2);font-size:14px}.ak-steps b{color:var(--fg)}
.bn-pick{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end;max-width:760px}
.bn-fixed{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--fg3);padding-bottom:8px}.bn-fixed svg{width:20px;height:20px}
.bn-slot{display:flex;flex-direction:column;gap:4px;min-width:0}.bn-slot small{font-size:11.5px;font-weight:700;color:var(--fg3)}.bn-slot select{width:100%}
@media (max-width:760px){.bn-pick{grid-template-columns:repeat(3,minmax(0,1fr))}.bn-fixed{display:none}}
/* ---------- trading agent ---------- */
.ag-lev{display:inline-flex;align-items:center;padding:2px 7px;border-radius:7px;background:var(--acc-bg);color:var(--accent);font:800 11.5px/1.2 var(--sans);border:1px solid var(--acc-line);font-variant-numeric:tabular-nums}
.ag-ov-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.ag-ov-sum>div{padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}.ag-ov-sum .k{display:block;font-size:11.5px;font-weight:700;color:var(--fg3)}.ag-ov-sum b{font-size:17px;font-weight:800}
.ag-ov td,.ag-ov th{white-space:nowrap}
@media (max-width:760px){.ag-ov-sum{grid-template-columns:repeat(2,minmax(0,1fr))}}

.ag-hero{background:radial-gradient(520px 260px at 0% 0%,var(--acc-bg),transparent 70%),radial-gradient(420px 260px at 100% 100%,color-mix(in srgb,var(--accent-b) 10%,transparent),transparent 70%),var(--card)}
.ag-top{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.ag-top b{display:block;font-family:var(--display);font-size:17px}.ag-top .dim{font-size:12.5px}
.ag-bot{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--grad);color:#fff;flex:none;box-shadow:0 8px 22px color-mix(in srgb,var(--accent-b) 30%,transparent)}
.ag-bot svg{width:24px;height:24px}
#ag-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr);gap:14px 28px;align-items:end}
.ag-hero-v .k,.ag-cmp .k,.ag-stats .k{display:block;font-size:12px;font-weight:700;color:var(--fg3)}
.ag-hero-v b{display:block;font-family:var(--display);font-size:clamp(34px,5vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.05}

/* ---------- news analysis ---------- */

.ns{display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}

.ns.ns-pos::before{background:var(--up)}.ns.ns-neg::before{background:var(--down)}.ns.ns-mix::before{background:var(--warn)}

.ns h3 a{color:var(--fg);text-decoration:none}.ns h3 a:hover{text-decoration:underline}
.ns-sec h4{margin:0 0 4px;font:800 12.5px/1.2 var(--sans);color:var(--fg3);text-transform:uppercase;letter-spacing:.05em;display:flex;gap:8px;align-items:center}
.ns-sec p{margin:0;font-size:15px;line-height:1.55;max-width:75ch}
.ns-sec small{display:block;margin-top:4px;font-size:11.5px}

.ns-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.ns-chips a.ctag{text-decoration:none;color:var(--fg)}.ns-chips a.ctag:hover{border-color:var(--acc-line);color:var(--accent)}
.ns-f{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}

.ns-overall{margin:0 0 10px;font-size:15px}

.ns-ai-i::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--warn)}.ns-ai-i.ns-pos::before{background:var(--up)}.ns-ai-i.ns-neg::before{background:var(--down)}
.ns-ai-i h4{margin:8px 0 4px;font:800 15.5px/1.3 var(--sans)}.ns-ai-i p{margin:0 0 6px;font-size:14px;color:var(--fg2)}.ns-why b{color:var(--fg)}
/* ---------- intro (logo + name on every app start) ---------- */
#intro{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(600px 420px at 50% 42%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),var(--bg);animation:inOut .5s cubic-bezier(.4,0,.2,1) 1.75s both;cursor:pointer;-webkit-tap-highlight-color:transparent}
#intro.skip{animation:inOut .3s ease-out both}
#intro.gone{display:none}
.in-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;transform:translateZ(0)}
.in-logo{position:relative;width:118px;height:118px;animation:inLogo .9s cubic-bezier(.34,1.45,.64,1) .05s both;filter:drop-shadow(0 18px 40px color-mix(in srgb,var(--accent-b) 45%,transparent))}
.in-logo svg{width:100%;height:100%;display:block}
.in-halo{position:absolute;top:-30px;left:50%;width:260px;height:260px;margin-left:-130px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 38%,transparent),transparent 65%);animation:inHalo 1.6s ease-out both;pointer-events:none}
.in-ring{position:absolute;top:5px;left:50%;width:190px;height:190px;margin-left:-95px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 60%,transparent);animation:inRing 1.3s cubic-bezier(.16,1,.3,1) .25s both;pointer-events:none}
.in-name{display:flex;align-items:baseline;font-family:var(--display);font-size:clamp(36px,9vw,54px);letter-spacing:-.04em;line-height:1;overflow:hidden;padding:4px 6px 8px}
.in-a{font-weight:500;color:var(--fg);animation:inUp .7s cubic-bezier(.16,1,.3,1) .45s both}
.in-b{font-weight:800;margin-left:2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;animation:inUp .7s cubic-bezier(.16,1,.3,1) .58s both}
.in-tag{font:600 14px/1.3 var(--sans);color:var(--fg3);letter-spacing:.02em;animation:inFade .6s ease-out .85s both}
.in-bar{width:120px;height:3px;border-radius:3px;background:color-mix(in srgb,var(--fg) 10%,transparent);overflow:hidden;margin-top:6px;animation:inFade .4s ease-out .7s both}
.in-bar i{display:block;height:100%;background:var(--grad);border-radius:3px;transform-origin:left;animation:inBar 1.05s cubic-bezier(.65,0,.35,1) .7s both}
@keyframes inLogo{0%{opacity:0;transform:scale(.55) rotate(-18deg)}60%{opacity:1}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes inHalo{0%{opacity:0;transform:scale(.6)}40%{opacity:1}100%{opacity:.55;transform:scale(1)}}
@keyframes inRing{0%{opacity:.9;transform:scale(.55)}100%{opacity:0;transform:scale(1.25)}}
@keyframes inUp{from{opacity:0;transform:translate3d(0,100%,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes inFade{from{opacity:0}to{opacity:1}}
@keyframes inBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes inOut{from{opacity:1;visibility:visible}to{opacity:0;visibility:hidden;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){#intro{animation:inOut .3s ease-out .6s both!important}#intro *{animation:none!important}}
/* ---------- motion (GPU-only: opacity + transform, no blur, no full-page snapshots) ---------- */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--ease-in:cubic-bezier(.4,0,1,1);--spring:cubic-bezier(.34,1.3,.64,1)}
#view.a-pre,#view.a-pre-tab>.tabs~*,.a-pre{opacity:0}
#view.a-fade{animation:pgIn .34s var(--ease-out) both}
#view.a-fwd{animation:pgInR .36s var(--ease-out) both}
#view.a-back{animation:pgInL .36s var(--ease-out) both}
#view.a-tab>.tabs~*{animation:pgIn .3s var(--ease-out) both}
#view.a-fade,#view.a-fwd,#view.a-back{will-change:opacity,transform}
@keyframes pgIn{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes pgInR{from{opacity:0;transform:translate3d(26px,0,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes pgInL{from{opacity:0;transform:translate3d(-26px,0,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes rise{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-bg{background:rgba(4,6,12,.72);animation:bgIn .24s ease-out both}
.modal{animation:modalIn .36s var(--ease-out) both;will-change:transform,opacity}
.modal-bg.out{animation:bgOut .18s ease-in both}.modal-bg.out .modal{animation:modalOut .18s var(--ease-in) both}
.modal-bg.still,.modal-bg.still .modal{animation:none}
@keyframes bgIn{from{opacity:0}to{opacity:1}}@keyframes bgOut{from{opacity:1}to{opacity:0}}
@keyframes modalIn{from{opacity:0;transform:translate3d(0,18px,0) scale(.97)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}
@keyframes modalOut{from{opacity:1;transform:translate3d(0,0,0)}to{opacity:0;transform:translate3d(0,10px,0) scale(.985)}}
.sheet-bg{animation:bgIn .24s ease-out both}.sheet{animation:sheetIn .38s var(--ease-out) both;will-change:transform}
.sheet-bg.out{animation:bgOut .2s ease-in both}.sheet-bg.out .sheet{animation:sheetOut .2s var(--ease-in) both}
@keyframes sheetIn{from{transform:translate3d(0,100%,0)}to{transform:translate3d(0,0,0)}}@keyframes sheetOut{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,100%,0)}}
.btn{transition:transform .14s var(--ease-out),filter .2s,border-color .2s,background-color .2s,color .2s}
.btn:active:not(:disabled){transform:scale(.96)}
.tile{transition:border-color .2s,transform .25s var(--ease-out)}
.cc{transition:border-color .2s,transform .25s var(--ease-out)}
.tile:active,.cc:active{transform:scale(.98)}
.tabs button{transition:background-color .2s,color .2s,border-color .2s,transform .14s var(--ease-out)}
.tabs button:active,.seg button:active,.fchips button:active{transform:scale(.95)}
.seg button{transition:background-color .2s,color .2s,box-shadow .2s,transform .14s var(--ease-out)}
.tabsnav a.on::after{animation:uline .4s var(--ease-out) both;transform-origin:center}
@keyframes uline{from{transform:scaleX(.2);opacity:0}to{transform:scaleX(1);opacity:1}}
.bnav .on svg{animation:pop .42s var(--spring) both}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.toast{animation:rise .32s var(--ease-out) both}
.qres:not([hidden]){animation:rise .22s var(--ease-out) both}
.help p,.kd p,.cat-d p,.desc-d .desc{animation:fadeIn .25s ease-out both}
/* ---------- calendar (Apple-style views) ---------- */
:root{--k-cb:#A78BFA;--k-macro:#5EA8FF;--k-crypto:var(--accent);--k-market:#34D399;--k-custom:#F472B6;--k-hours:#8B93A7}
:root[data-theme="light"]{--k-cb:#7C3AED;--k-macro:#2563EB;--k-market:#059669;--k-custom:#DB2777;--k-hours:#64748B}
.k-cb{--kc:var(--k-cb)}.k-macro{--kc:var(--k-macro)}.k-crypto{--kc:var(--k-crypto)}.k-market{--kc:var(--k-market)}.k-custom{--kc:var(--k-custom)}.k-hours{--kc:var(--k-hours)}
.cal{--lw:54px;padding:18px 18px 16px;overflow:hidden}
.cal-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cal-crumb{display:block;border:0;background:none;color:var(--accent);font:700 13.5px/1.2 var(--sans);padding:0;margin:0 0 4px;cursor:pointer}

.cal-nav .icon-btn{font-size:20px;font-weight:600;color:var(--fg);line-height:1}
.cal-nav .icon-btn.add{background:var(--grad);border-color:transparent;color:#fff;font-size:22px}
.cal-seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;margin:16px 0 12px}
.cal-seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:9px;background:var(--card2);box-shadow:0 1px 3px rgba(0,0,0,.3),inset 0 0 0 1px var(--line2);transform:translateX(calc(var(--i)*100%));transition:transform .5s var(--spring)}

.cal-cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding-bottom:2px}
.cal-cats::-webkit-scrollbar{display:none}
.cal-cat{display:inline-flex;align-items:center;gap:7px;flex:none;border:1px solid var(--line);background:none;color:var(--fg3);border-radius:999px;padding:5px 11px;font:700 12px/1.2 var(--sans);cursor:pointer;transition:color .2s,border-color .2s,background-color .2s,transform .16s var(--ease-out)}

.cal-cat.on{color:var(--fg);border-color:var(--line2);background:var(--card2)}.cal-cat.on i{background:var(--kc)}
.cal-cat:active{transform:scale(.95)}
.cal-body.a-pre,.cal-list.a-pre{opacity:0}
.cal-body.a-next{animation:calNext .34s var(--ease-out) both}.cal-body.a-prev{animation:calPrev .34s var(--ease-out) both}
.cal-body.a-zin{animation:calZin .36s var(--ease-out) both}.cal-body.a-zout{animation:calZout .36s var(--ease-out) both}.cal-body.a-fade,.cal-list.a-fade{animation:rise .3s var(--ease-out) both}
.cal-body[class*="a-"]{will-change:transform,opacity}
@keyframes calNext{from{opacity:0;transform:translate3d(30px,0,0)}to{opacity:1;transform:translate3d(0,0,0)}}@keyframes calPrev{from{opacity:0;transform:translate3d(-30px,0,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes calZin{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}@keyframes calZout{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:scale(1)}}
.cal-wd{border:0;background:none;color:var(--fg3);font:700 11.5px/1.2 var(--sans);display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 8px;cursor:pointer;text-transform:capitalize;min-width:0}

.cal-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}

.cal-pill{display:block;width:calc(100% - 4px);margin:1px 2px;border:0;border-left:3px solid var(--kc);text-align:left;border-radius:6px;padding:3px 6px;font:700 11px/1.3 var(--sans);color:var(--fg);background:color-mix(in srgb,var(--kc) 22%,var(--card));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}

.cal-grid{position:relative}

const store = {
  get(k, d){ try{ const v = localStorage.getItem('bro.'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('bro.'+k, JSON.stringify(v)); }catch(e){} },
  keys(){ try{ return Object.keys(localStorage).filter(k=>k.startsWith('bro.')); }catch(e){ return []; } },
  clear(){ this.keys().forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} }); }
};

['pages','hidden','favs','watch','feedsOff','customFeeds'].forEach(k => { if(!Array.isArray(S[k])) S[k] = DEF[k].slice(); });
ALL_PAGES.forEach((p,i) => { if(!S.pages.includes(p)){ const prev = ALL_PAGES[i-1]; const at = prev ? S.pages.indexOf(prev) : -1; if(at >= 0) S.pages.splice(at+1, 0, p); else S.pages.push(p); } });
S.pages = S.pages.filter(p => ALL_PAGES.includes(p));
if(!S.meta || typeof S.meta !== 'object') S.meta = Object.assign({}, DEF.meta);
const saveS = () => store.set('settings', S);

function tagItem(n){

function scoreNews(n, all){

}

function todayItems(){

  exIds.forEach(id => { const ex = EXCH.find(x => x.id===id); if(!ex) return; const iv = intervals(ex, ds, de); if(!iv.length) return;

  const ny = EXCH[0]; const pre = intervals(ny, ds, de, true); if(pre.length && inDay(pre[0][0]) && !simple()) items.push({k:'mkt', at:pre[0][0], title:t('ev_pre'), cd:true, href:'#calendar', tab:'hours'});

  news.forEach(n => items.push({k:'news', at:n.t, title:n.title, sub:n.src, link:n.link}));

/* ---- Leaderboard ---- */
function lbData(win){
  const minV = S.minVol, rate = usdRate() || 1;
  if((win==='24h' || win==='15m') && Object.keys(D.all).length > 20){
    let rows = Object.values(D.all).filter(r => r.qv >= minV && r.price > 0);
    if(win==='15m'){ const now = Date.now(); rows = rows.map(r => { const h = D.hist[r.base]; if(!h || h.length < 2) return null; let ref = h[0]; for(const p of h){ if(p[0] >= now - 15*6e4){ ref = p; break; } } return Object.assign({}, r, {w:(r.price/ref[1]-1)*100}); }).filter(Boolean); }
    else rows = rows.map(r => Object.assign({}, r, {w:r.chg}));
    rows.sort((a,b)=>b.w-a.w);
    const img = sym => { const c = (D.markets||[]).find(x => x.symbol.toUpperCase()===sym); return c ? {img:c.image, name:c.name, id:c.id} : {img:null, name:'', id:null}; };
    return {live:true, src:D.liveSrc?D.liveSrc.name:'Binance', n:rows.length, up:rows.filter(r=>r.w>0), dn:rows.filter(r=>r.w<0).reverse(), map:r=>Object.assign({sym:r.base, price:r.price*rate, w:r.w, vol:r.qv*rate}, img(r.base))};
  }
  const key = win==='1h' ? 'price_change_percentage_1h_in_currency' : win==='7d' ? 'price_change_percentage_7d_in_currency' : 'price_change_percentage_24h_in_currency';
  const rows = (D.markets||[]).filter(c => !isStable(c) && c[key]!=null && (c.total_volume||0) >= minV*rate).sort((a,b)=>b[key]-a[key]);
  return {live:false, src:D.mktSrc, n:rows.length, up:rows.filter(c=>c[key]>0), dn:rows.filter(c=>c[key]<0).reverse(), map:c=>({sym:c.symbol.toUpperCase(), name:c.name, price:c.current_price, w:c[key], vol:c.total_volume, img:c.image, id:c.id})};
}
function leaderboardHTML(win, n){

}

  const body = fresh ? `<div class="md">${md(c.text)}</div>${aiSources(c.sources)}<div class="note">${badge('ai')} ${esc(t('o_ai'))}</div>` : `<div class="md">${ruleBriefing()}</div>`;
  $('#modal-root').innerHTML = `<div class="modal-bg" data-act="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="hello-h">
    <div class="modal-h"><div><h2 id="hello-h">${esc(S.greet||'Hello sir')}.</h2><p>${esc(t('b_sub', fmtDate(new Date())+' · '+fmtTime(new Date())))}</p></div><button class="btn ghost" data-act="close">${esc(t('close'))}</button></div>
    <div id="hello-body" style="margin-top:8px">${body}</div>
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center"><button class="btn pri" data-act="ai-brief">${esc(fresh?t('regen'):t('ai_btn'))}</button>${!S.aiKey?`<span class="dim" style="font-size:13px">${esc(t('ai_need'))}</span>`:''}</div></div></div>`;
  const b = $('.modal [data-act="close"]'); if(b) b.focus();
}
async function aiBrief(){
  if(!S.aiKey){ askKey(() => { openHello(); setTimeout(aiBrief, 350); }); return; }
  const out = $('#hello-body'), btn = $('[data-act="ai-brief"]'); if(btn) btn.disabled = true; out.innerHTML = `<div class="empty">${esc(t('ai_working'))}</div>`;
  try{ const [sys, user] = briefPrompt(); const r = await askClaude(sys, user, true); store.set('briefing', {at:Date.now(), lang:S.lang, text:r.text, sources:r.sources});
    out.innerHTML = `<div class="md">${md(r.text)}</div>${aiSources(r.sources)}<div class="note">${badge('ai')} ${esc(t('o_ai'))}</div>`; }
  catch(e){ out.innerHTML = `<div class="err"><b>${esc(t('ai_err', e.message))}</b></div><div class="md">${ruleBriefing()}</div>`; }

  const out = $('#ai-scan-out'); out.innerHTML = `<div class="empty">${esc(t('ai_working'))}</div>`; const no = S.lang !== 'en';

let csTimer = 0;
function coinSearch(q, boxId, act){
  clearTimeout(csTimer); const box = $('#'+boxId); if(!box) return; if(q.trim().length < 2){ box.hidden = true; return; }
  csTimer = setTimeout(async () => {
    const lq = q.toLowerCase(); const local = (D.markets||[]).filter(c => c.name.toLowerCase().includes(lq) || c.symbol.toLowerCase().startsWith(lq)).slice(0,6).map(c=>({id:c.id,name:c.name,symbol:c.symbol,thumb:c.image,rank:c.market_cap_rank}));
    let remote = []; try{ const j = await cg('search', {query:q}); remote = (j.coins||[]).slice(0,8).map(c=>({id:c.id,name:c.name,symbol:c.symbol,thumb:c.thumb,rank:c.market_cap_rank})); }catch(e){}
    const all = local.concat(remote.filter(r=>!local.find(l=>l.id===r.id))).slice(0,10); const bx = $('#'+boxId); if(!bx) return;
    bx.innerHTML = all.length ? all.map(c=>`<a href="#" data-act="${act}" data-id="${esc(c.id)}" data-sym="${esc(String(c.symbol).toLowerCase())}">${c.thumb?`<img src="${esc(safeUrl(c.thumb))}" alt="" width="20" height="20" style="border-radius:50%">`:''}<span>${esc(c.name)} <span class="dim">${esc(String(c.symbol).toUpperCase())}${c.rank?' · #'+c.rank:''}</span></span></a>`).join('') : '<div class="empty">—</div>';
    bx.hidden = false;
  }, 300);
}

  if(UI.route==='coin'){ if(arg) UI.coinId = arg; if(!UI.coinId) UI.route = 'home'; }

  withTransition(kind, () => {
    $('#sheet-root').innerHTML = ''; $('#modal-root').innerHTML = '';

/* ---------- candles ---------- */
const TF = {'15m':{by:'15', okx:'15m', cb:900, ms:15*6e4, l:'15m'}, '1h':{by:'60', okx:'1H', cb:3600, ms:HOUR, l:'1t'}, '4h':{by:'240', okx:'4H', cb:null, ms:4*HOUR, l:'4t'}, '1d':{by:'D', okx:'1Dutc', cb:86400, ms:DAY, l:'1d'}};
const KL = {};
async function loadCandles(sym, tf, force){
  const key = sym+'|'+tf, c = KL[key]; if(c && !force && Date.now()-c.at < 55000) return c;
  let candles = null, src = '';
  try{ const j = await getJSON(`https://api.bybit.com/v5/market/kline?category=spot&symbol=${encodeURIComponent(sym)}USDT&interval=${TF[tf].by}&limit=300`, 12000); if(j.retCode!==0 || !j.result || !j.result.list || !j.result.list.length) throw new Error(j.retMsg||'empty'); candles = j.result.list.map(r=>({t:+r[0], o:+r[1], h:+r[2], l:+r[3], c:+r[4], v:+r[5]})).reverse(); src = 'Bybit'; }
  catch(e){
    try{ const j = await getJSON(`https://www.okx.com/api/v5/market/candles?instId=${encodeURIComponent(sym)}-USDT&bar=${TF[tf].okx}&limit=300`, 12000); if(j.code!=='0' || !j.data || !j.data.length) throw new Error(j.msg||'empty'); candles = j.data.map(r=>({t:+r[0], o:+r[1], h:+r[2], l:+r[3], c:+r[4], v:+r[5]})).reverse(); src = 'OKX'; }
    catch(e2){ if(!TF[tf].cb) throw e2; const j = await getJSON(`https://api.exchange.coinbase.com/products/${encodeURIComponent(sym)}-USD/candles?granularity=${TF[tf].cb}`, 12000); candles = j.map(r=>({t:r[0]*1000, o:r[3], h:r[2], l:r[1], c:r[4], v:r[5]})).reverse(); src = 'Coinbase'; }
  }
  if(!candles || candles.length < 30) throw new Error('no candles');
  KL[key] = {at:Date.now(), src, candles}; return KL[key];
}
function liveCandles(sym, tf){
  const k = KL[sym+'|'+tf]; if(!k) return null; const cs = k.candles; const L = D.all[sym];
  if(L && L.price && Date.now()-L.t < 60000){
    const p = L.price, last = cs[cs.length-1];
    if(Date.now() >= last.t + TF[tf].ms){ cs.push({t:last.t + TF[tf].ms, o:last.c, h:Math.max(last.c,p), l:Math.min(last.c,p), c:p, v:0}); if(cs.length > 320) cs.shift(); }
    else { last.c = p; if(p > last.h) last.h = p; if(p < last.l) last.l = p; }
  }
  return cs;
}
const livePx = sym => { const L = D.all[sym]; if(L && L.price && Date.now()-L.t < 90000) return L.price; const k = KL[sym+'|'+UI.tr.tf] || KL[sym+'|4h']; return k ? k.candles[k.candles.length-1].c : null; };

/* ---------- analysis (method from the document) ---------- */
function emaArr(a, n){ const k = 2/(n+1); let e = a[0]; return a.map((v,i) => i ? (e = v*k + e*(1-k)) : e); }
function atrOf(c, n=14){ const tr = []; for(let i=1;i<c.length;i++) tr.push(Math.max(c[i].h-c[i].l, Math.abs(c[i].h-c[i-1].c), Math.abs(c[i].l-c[i-1].c))); const s = tr.slice(-n); return s.reduce((a,b)=>a+b,0)/Math.max(1,s.length); }
function cInfo(x){ const body = Math.abs(x.c-x.o), range = Math.max(x.h-x.l, 1e-12); return {body, range, up:x.h-Math.max(x.o,x.c), lo:Math.min(x.o,x.c)-x.l, green:x.c>=x.o}; }
function analyze(cs){
  if(!cs || cs.length < 40) return null;
  const closed = cs.slice(0,-1), N = closed.length, price = cs[cs.length-1].c, A = atrOf(closed);
  const k = 3, piv = [];
  for(let i=k;i<N-k;i++){ let hi = true, lo = true; for(let j=i-k;j<=i+k;j++){ if(j===i) continue; if(closed[j].h > closed[i].h) hi = false; if(closed[j].l < closed[i].l) lo = false; } if(hi) piv.push({p:closed[i].h, i, type:'H'}); if(lo) piv.push({p:closed[i].l, i, type:'L'}); }
  const tol = Math.max(A*0.5, price*0.0025);
  const cl = []; piv.slice().sort((a,b)=>a.p-b.p).forEach(pt => { const c = cl[cl.length-1]; if(c && pt.p - c.max <= tol && pt.p - c.min <= tol*2){ c.pts.push(pt); c.max = pt.p; } else cl.push({pts:[pt], max:pt.p, min:pt.p}); });
  let levels = cl.filter(c => c.pts.length >= 2).map(c => { const ps = c.pts.map(x=>x.p); return {price:ps.reduce((a,b)=>a+b,0)/ps.length, touches:c.pts.length, highs:c.pts.filter(x=>x.type==='H').length, lows:c.pts.filter(x=>x.type==='L').length, last:Math.max(...c.pts.map(x=>x.i))}; });
  levels.forEach(l => { l.flip = l.highs > 0 && l.lows > 0; l.kind = l.price < price ? 'S' : 'R'; });
  const rec = closed.slice(-120); const rh = Math.max(...rec.map(x=>x.h)), rl = Math.min(...rec.map(x=>x.l));
  if(!levels.some(l => Math.abs(l.price-rh) <= tol)) levels.push({price:rh, touches:1, highs:1, lows:0, weak:true, kind: rh < price ? 'S':'R'});
  if(!levels.some(l => Math.abs(l.price-rl) <= tol)) levels.push({price:rl, touches:1, highs:0, lows:1, weak:true, kind: rl < price ? 'S':'R'});
  const sups = levels.filter(l => l.price < price - tol*0.2).sort((a,b)=>b.price-a.price);
  const ress = levels.filter(l => l.price > price + tol*0.2).sort((a,b)=>a.price-b.price);
  // trend: structure + EMA
  const ph = piv.filter(x=>x.type==='H').slice(-2), pl = piv.filter(x=>x.type==='L').slice(-2);
  let sc = 0; if(ph.length===2) sc += ph[1].p > ph[0].p ? 1 : -1; if(pl.length===2) sc += pl[1].p > pl[0].p ? 1 : -1;
  const closes = closed.map(x=>x.c), e50 = emaArr(closes, 50); sc += closes[N-1] > e50[N-1] ? 1 : -1;
  if(N >= 200){ const e200 = emaArr(closes, 200); sc += e50[N-1] > e200[N-1] ? 1 : -1; }
  const trend = sc >= 2 ? 'up' : sc <= -2 ? 'down' : 'side';
  // candle patterns on the last 3 closed candles
  const patterns = [];
  for(let i = N-3; i < N; i++){ if(i < 5) continue; const x = closed[i], c = cInfo(x), p = closed[i-1], pc = cInfo(p); if(c.range < A*0.35) continue;
    const priorDown = closed[i-1].c < closed[i-5].c, priorUp = closed[i-1].c > closed[i-5].c;
    if(c.lo >= 2*c.body && c.up <= 0.3*c.range && priorDown) patterns.push({i, kind:'hammer', bias:'bull'});
    else if(c.lo >= 0.5*c.range) patterns.push({i, kind:'lowWick', bias:'bull'});
    if(c.up >= 2*c.body && c.lo <= 0.3*c.range && priorUp) patterns.push({i, kind:'star', bias:'bear'});
    else if(c.up >= 0.5*c.range) patterns.push({i, kind:'upWick', bias:'bear'});
    if(!pc.green && c.green && x.c >= p.o && x.o <= p.c && c.body > pc.body) patterns.push({i, kind:'bullEng', bias:'bull'});
    if(pc.green && !c.green && x.c <= p.o && x.o >= p.c && c.body > pc.body) patterns.push({i, kind:'bearEng', bias:'bear'});
  }
  // breakout / breakdown + retest
  let event = null;
  levels.filter(l => !l.weak).forEach(l => {
    for(let j = N-12; j < N; j++){ if(j < 1) continue;
      if(closed[j-1].c < l.price && closed[j].c > l.price + 0.1*A && price > l.price){ const after = closed.slice(j+1); const rt = after.some(x => x.l <= l.price + 0.35*A) && closed[N-1].c > l.price; if(!event || j > event.j) event = {kind:'bo', level:l, j, retest:rt}; }
      if(closed[j-1].c > l.price && closed[j].c < l.price - 0.1*A && price < l.price){ const after = closed.slice(j+1); const rt = after.some(x => x.h >= l.price - 0.35*A) && closed[N-1].c < l.price; if(!event || j > event.j) event = {kind:'bd', level:l, j, retest:rt}; }
    }
  });
  // setups
  const bull = patterns.filter(p => p.bias==='bull'), bear = patterns.filter(p => p.bias==='bear');
  const recentLow = Math.min(...closed.slice(-3).map(x=>x.l)), recentHigh = Math.max(...closed.slice(-3).map(x=>x.h));
  const mk = (side, base, factors, trig) => {
    const entry = price; let sl, tp, est = false;
    if(side==='long'){ sl = Math.min(base.price, recentLow) - 0.3*A; const t = ress.find(r => r.price > entry + 0.5*A); if(t) tp = t.price; else { tp = entry + 2*(entry-sl); est = true; } }
    else { sl = Math.max(base.price, recentHigh) + 0.3*A; const t = sups.find(s => s.price < entry - 0.5*A); if(t) tp = t.price; else { tp = entry - 2*(sl-entry); est = true; } }
    const rr = Math.abs(tp-entry)/Math.max(1e-12, Math.abs(entry-sl)); if(est) factors.push({k:'cf_tp_est', neutral:true});
    const counter = (side==='long' && trend==='down') || (side==='short' && trend==='up'); if(counter) factors.push({k:'cf_counter', neutral:true});
    return {side, entry, sl, tp, rr, factors, trig, score:factors.filter(f=>!f.neutral).length, est, counter};
  };
  const cands = [];
  const S1 = sups[0], R1 = ress[0], near = Math.max(1.5*A, price*0.012);
  if(S1 && price - S1.price <= near){ const f = [{k:'cf_sup', a:S1.touches}]; if(bull.length) f.push({k:'cf_bull', a:t('pat.'+bull[bull.length-1].kind)}); if(trend==='up') f.push({k:'cf_tr_up'}); if(bull.length) cands.push(mk('long', S1, f, bull.length ? 'pattern' : 'bounce')); }
  if(R1 && R1.price - price <= near){ const f = [{k:'cf_res', a:R1.touches}]; if(bear.length) f.push({k:'cf_bear', a:t('pat.'+bear[bear.length-1].kind)}); if(trend==='down') f.push({k:'cf_tr_dn'}); if(bear.length) cands.push(mk('short', R1, f, bear.length ? 'pattern' : 'reject')); }
  if(event && event.retest){ if(event.kind==='bo'){ const f = [{k:'cf_rt'}]; if(trend!=='down') f.push({k:'cf_tr_up'}); if(bull.length) f.push({k:'cf_bull', a:t('pat.'+bull[bull.length-1].kind)}); cands.push(mk('long', event.level, f, 'retest')); }
    else { const f = [{k:'cf_rt'}]; if(trend!=='up') f.push({k:'cf_tr_dn'}); if(bear.length) f.push({k:'cf_bear', a:t('pat.'+bear[bear.length-1].kind)}); cands.push(mk('short', event.level, f, 'retest')); } }
  const valid = cands.filter(c => c.rr >= 1.5 && c.score >= (c.counter ? 3 : 2)).sort((a,b) => b.score-a.score || b.rr-a.rr);
  return {price, A, tol, levels, sups, ress, trend, patterns, event, setup: valid[0] || null, cands, N};
}

function calcPlan(P){
  const e = parseFloat(P.entry), sl = parseFloat(P.sl), tp = parseFloat(P.tp), cap = +S.capital, rp = +S.riskPct;
  const errs = []; const long = P.side==='long';

  const maxLoss = cap*rp/100; const ok = isFinite(e) && isFinite(sl) && e>0 && !errs.length && Math.abs(e-sl) > 0;

      if(st){ UI.plan = Object.assign(UI.plan, {side:st.side, entry:+st.entry.toPrecision(7), sl:+st.sl.toPrecision(7), tp:+st.tp.toPrecision(7), trig:st.trig}); }
      else { const long = UI.plan.side==='long'; const lvl = long ? an.sups[0] : an.ress[0], tg = long ? an.ress[0] : an.sups[0]; UI.plan.entry = +an.price.toPrecision(7); if(lvl) UI.plan.sl = +(long ? lvl.price - 0.3*an.A : lvl.price + 0.3*an.A).toPrecision(7); if(tg) UI.plan.tp = +tg.price.toPrecision(7); }
      renderView(); };
    if(k) go2(); else loadCandles(UI.plan.sym, '4h').then(go2).catch(()=>toast(t('tr_load_err'))); }
  else if(act==='pl-open'){ const P = readPlan(); if(openDemo(P.sym, P.side, parseFloat(P.sl), parseFloat(P.tp), P.trig, S.riskPct)){ UI.tab.trade = 'demo'; renderView(); } }
  else if(act==='dm-close'){ const x = demo().trades.find(y=>y.id===a.dataset.id); const px = x && livePx(x.sym); if(px){ closeDemo(x.id, px, 'manual'); renderView(); } else toast(t('dm_noprice')); }
  else if(act==='dm-reset'){ if(UI.dmReset){ saveDemo({start: demo().start, trades:[]}); UI.dmReset = false; renderView(); } else { UI.dmReset = true; renderView(); setTimeout(()=>{ UI.dmReset = false; if(UI.route==='trade' && UI.tab.trade==='demo') renderView(); }, 4000); } }
  else if(act==='try-live'){ e.preventDefault(); UI.tab.trade = a.dataset.tab; go('trade'); }
}catch(err){ logErr(err); } });
document.addEventListener('change', e => { try{ const el = e.target;
  if(el.id==='tr-sym'){ UI.tr.sym = el.value; renderView(); }
  if(el.id==='pl-sym'){ readPlan(); renderView(); if(!KL[UI.plan.sym+'|4h']) loadCandles(UI.plan.sym, '4h').then(updatePlanOut).catch(()=>{}); }
  if(el.dataset.note){ const d = demo(); const x = d.trades.find(y=>y.id===el.dataset.note); if(x){ x.note = el.value.slice(0,500); saveDemo(d); toast(t('saved')); } }
  if(el.id==='dm-start'){ const v = +el.value; if(v >= 100){ const d = demo(); d.start = v; saveDemo(d); renderView(); } }
}catch(err){ logErr(err); } });
document.addEventListener('input', e => { const id = e.target.id; if(['pl-cap','pl-risk','pl-entry','pl-sl','pl-tp','pl-trig'].includes(id)) updatePlanOut(); });
document.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.id==='tr-other'){ e.preventDefault(); const v = e.target.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,''); if(v){ UI.tr.sym = v; renderView(); } } });

/* ---------- small illustrations drawn for the app ---------- */
function figCandles(list, opt={}){
  const W = 300, H = 150, n = list.length, cw = (W-20)/n, Y = v => 10 + (1-v/100)*(H-20);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="fig" role="img" aria-label="${esc(opt.label||'')}">`;
  list.forEach((c,i) => { const [o,h,l,cl] = c, g = cl >= o, col = g ? 'var(--up)' : 'var(--down)', x = 10 + (i+0.5)*cw, bw = Math.min(18, cw*0.55);
    if((opt.hl||[]).includes(i)) s += `<rect x="${x-cw/2+2}" y="6" width="${cw-4}" height="${H-12}" rx="6" fill="var(--fg)" opacity=".07"/>`;
    s += `<line x1="${x}" x2="${x}" y1="${Y(h)}" y2="${Y(l)}" stroke="${col}" stroke-width="2"/><rect x="${x-bw/2}" y="${Y(Math.max(o,cl))}" width="${bw}" height="${Math.max(2,Math.abs(Y(o)-Y(cl)))}" rx="2" fill="${col}"/>`; });
  (opt.notes||[]).forEach(nt => { s += `<text x="${nt.x}" y="${nt.y}" font-size="11" font-weight="800" fill="${nt.c||'var(--fg2)'}" text-anchor="${nt.a||'middle'}">${esc(nt.t)}</text>`; });
  return s + '</svg>';
}
function figPath(pts, opt={}){
  const W = 300, H = 150, X = x => 10 + x/100*(W-20), Y = y => 10 + (1-y/100)*(H-20);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="fig" role="img" aria-label="${esc(opt.label||'')}">`;
  (opt.lines||[]).forEach(l => { s += `<line x1="${X(l.x0||0)}" x2="${X(l.x1==null?100:l.x1)}" y1="${Y(l.y)}" y2="${Y(l.y)}" stroke="${l.c}" stroke-width="3" stroke-linecap="round"/>${l.t?`<text x="${X(l.tx==null?(l.x0||0):l.tx)}" y="${Y(l.y)+(l.below?16:-7)}" font-size="11.5" font-weight="800" fill="${l.c}">${esc(l.t)}</text>`:''}`; });
  s += `<polyline points="${pts.map(([x,y])=>X(x)+','+Y(y)).join(' ')}" fill="none" stroke="var(--fg)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  (opt.notes||[]).forEach(nt => { s += `<text x="${X(nt.x)}" y="${Y(nt.y)}" font-size="11" font-weight="800" fill="${nt.c||'var(--fg2)'}" text-anchor="${nt.a||'middle'}">${esc(nt.t)}</text>`; });
  return s + '</svg>';
}
