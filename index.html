  Lz('f-practice', {tryTab:'demo'},
   ['Øv før du satser', 'Ingen lærer å svømme ved å hoppe ut på dypt vann. En trygg rekkefølge:\n\n1. **Demokonto**: virtuelle penger på ekte priser. Her øver du på å lese grafen, tegne nivåer og følge en plan.\n2. **Spot med små beløp**: du kjøper selve mynten, uten giring. Feil koster lite.\n3. **Giring og futures**: først når du over tid har vist at du følger planen.\n\nGiring forstørrer både gevinst og tap. Med 10x giring koster en feil ti ganger så mye. Derfor kommer det sist.\n\nI appen: Demotrading-fanen er trinn 1.'],
   ['Practise before you risk money', 'Nobody learns to swim by jumping into deep water. A safe order:\n\n1. **Demo account**: virtual money on real prices. Practise reading the chart, drawing levels and following a plan.\n2. **Spot with small amounts**: you buy the coin itself, no leverage. Mistakes cost little.\n3. **Leverage and futures**: only once you have shown over time that you follow your plan.\n\nLeverage magnifies both gains and losses. With 10x leverage a mistake costs ten times as much. That is why it comes last.\n\nIn the app: the Demo trading tab is step 1.'],
   [Qz(['Hva er en trygg rekkefølge?', ['Demo → spot → giring','Giring → spot → demo','Spot → giring → demo','Rett på giring for å lære raskt']], ['What is a safe order?', ['Demo → spot → leverage','Leverage → spot → demo','Spot → leverage → demo','Straight to leverage to learn fast']]),
    Qz(['Hva betyr spot-trading?', ['Du kjøper selve mynten uten giring','Du låner penger av børsen','Du satser bare på at prisen faller','Du trader bare om natten']], ['What does spot trading mean?', ['You buy the coin itself with no leverage','You borrow money from the exchange','You only bet on the price falling','You only trade at night']]),
    Qz(['Hvorfor bør giring komme sist?', ['Den forstørrer både gevinst og tap','Den gir alltid gevinst','Den gjør prisene mer stabile','Den fjerner behovet for stop loss']], ['Why should leverage come last?', ['It magnifies both gains and losses','It always gives a profit','It makes prices more stable','It removes the need for a stop loss']]),
    Qz(['Hva er en demokonto?', ['Virtuelle penger på ekte priser','En konto med gratis bitcoin','En konto som bare viser gamle priser','En konto som trader automatisk for deg']], ['What is a demo account?', ['Virtual money on real prices','An account with free bitcoin','An account showing only old prices','An account that trades automatically for you']])]),
  Lz('f-emotions', {tryTab:'analyse'},
   ['Trade grafen, ikke følelsene', 'Mange taper ikke fordi de mangler kunnskap, men fordi følelsene tar over.\n\n- **Ingen favorittmynt**: for en trader er en mynt verken god eller dårlig, bare en pris som beveger seg. Blir du glad i en mynt, holder du den for lenge.\n- **FOMO**: når noe har steget mye, frister det å hoppe på uten plan. Da kjøper du ofte nær toppen.\n- **Håp**: «den kommer sikkert tilbake» er ikke en strategi.\n\nMålet er enkelt: kjøpe lavere enn du selger. Grafen viser hvor det er sannsynlig, ikke magefølelsen.'],
   ['Trade the chart, not your feelings', 'Many people lose not because they lack knowledge, but because emotions take over.\n\n- **No favourite coin**: to a trader a coin is neither good nor bad, just a price that moves. Get attached and you hold it too long.\n- **FOMO**: when something has risen a lot it is tempting to jump in without a plan. Then you often buy near the top.\n- **Hope**: "it will surely come back" is not a strategy.\n\nThe goal is simple: buy lower than you sell. The chart shows where that is likely, not your gut.'],
   [Qz(['Hva er FOMO?', ['Å hoppe inn uten plan av frykt for å miste en oppgang','En type candlestick','En måte å regne ut risiko på','En børs i Asia']], ['What is FOMO?', ['Entering without a plan because you fear missing out','A type of candlestick','A way to calculate risk','An exchange in Asia']]),
    Qz(['Hvorfor er det farlig å bli glad i én mynt?', ['Du holder den for lenge selv når grafen sier noe annet','Den blir dyrere å kjøpe','Børsen stenger kontoen din','Den slutter å svinge']], ['Why is it dangerous to get attached to one coin?', ['You hold it too long even when the chart says otherwise','It becomes more expensive to buy','The exchange closes your account','It stops moving']]),
    Qz(['Hva bør beslutningene dine bygge på?', ['Det grafen viser','Hva som er populært på sosiale medier','Magefølelsen','Hvor mye du har tapt før']], ['What should your decisions be based on?', ['What the chart shows','What is popular on social media','Your gut feeling','How much you have lost before']]),
    Qz(['«Den kommer sikkert tilbake» er et eksempel på …', ['Håp, som ikke er en strategi','En god exit-plan','Risikostyring','Teknisk analyse']], ['"It will surely come back" is an example of …', ['Hope, which is not a strategy','A good exit plan','Risk management','Technical analysis']])]),
  Lz('f-losses', {tryTab:'demo'},
   ['Små tap hører med', 'Selv de beste traderne taper ofte. Forskjellen er at tapene deres er små.\n\n- Bestem på forhånd hvor du går ut hvis du tar feil (stop loss).\n- Når prisen kommer dit: **gå ut**. Ikke flytt stoppen lenger unna for å «gi traden mer tid».\n- Et lite tap er billig læring. Et tap du lar vokse, kan ta måneder å hente inn.\n\nRegnestykket: taper du 50 % av kontoen, må du tjene 100 % bare for å komme tilbake til start. Derfor lønner det seg å kutte tidlig.'],
   ['Small losses are part of the job', 'Even the best traders lose often. The difference is that their losses are small.\n\n- Decide in advance where you exit if you are wrong (stop loss).\n- When price gets there: **get out**. Do not move the stop further away to "give the trade more time".\n- A small loss is cheap learning. A loss you let grow can take months to win back.\n\nThe maths: lose 50% of the account and you need a 100% gain just to get back to where you started. That is why cutting early pays.'],
   [Qz(['Hva gjør du når prisen treffer stop loss?', ['Går ut av traden','Flytter stoppen lenger ned','Kjøper mer','Venter til den kommer tilbake']], ['What do you do when price hits your stop loss?', ['Exit the trade','Move the stop further down','Buy more','Wait for it to come back']]),
    Qz(['Du taper 50 % av kontoen. Hvor mye må du tjene for å komme tilbake?', ['100 %','50 %','25 %','75 %']], ['You lose 50% of the account. How much must you gain to get back?', ['100%','50%','25%','75%']]),
    Qz(['Hva skiller gode tradere fra dårlige?', ['Tapene deres er små','De taper aldri','De trader bare bitcoin','De bruker alltid høy giring']], ['What separates good traders from bad ones?', ['Their losses are small','They never lose','They only trade bitcoin','They always use high leverage']]),
    Qz(['Når bestemmer du hvor stop loss skal være?', ['Før du går inn i traden','Etter at prisen har falt','Når du har tapt 20 %','Aldri, det er bedre å vente']], ['When do you decide where the stop loss goes?', ['Before entering the trade','After the price has fallen','Once you have lost 20%','Never, it is better to wait']])]),
  Lz('f-plan', {tryTab:'plan'},
   ['Planen før knappen', 'Før du trykker «kjøp» skal du kunne svare på fire spørsmål:\n\n1. Hvorfor går jeg inn akkurat her? (entry)\n2. Hvor tar jeg feil? (stop loss)\n3. Hvor tar jeg gevinst? (target)\n4. Hvor stor skal posisjonen være? (risiko)\n\nKan du ikke svare, er det ingen trade.\n\nDu trenger ikke mange indikatorer eller skjermer. Mange erfarne tradere klarer seg nesten bare med support- og resistance-linjer. Det vanskelige er disiplinen: følge planen hver gang.\n\nSkriv hver trade i en journal og se over den jevnlig. Mens du lærer, gir mange små øvingstrades i trendens retning rask tilbakemelding på om metoden virker.'],
   ['The plan before the button', 'Before you press "buy" you should be able to answer four questions:\n\n1. Why am I entering exactly here? (entry)\n2. Where am I wrong? (stop loss)\n3. Where do I take profit? (target)\n4. How big should the position be? (risk)\n\nIf you cannot answer, there is no trade.\n\nYou do not need many indicators or screens. Many experienced traders manage almost entirely with support and resistance lines. The hard part is discipline: following the plan every time.\n\nWrite every trade in a journal and review it regularly. While learning, many small practice trades in the direction of the trend give fast feedback on whether your method works.'],
   [Qz(['Hva må være bestemt før du går inn?', ['Entry, stop loss, target og posisjonsstørrelse','Bare entry','Bare target','Ingenting, det bestemmes underveis']], ['What must be decided before you enter?', ['Entry, stop loss, target and position size','Only the entry','Only the target','Nothing, it is decided along the way']]),
    Qz(['Du vet ikke hvor stop loss skal være. Hva gjør du?', ['Lar være å ta traden','Tar traden uansett','Bruker dobbelt så mye giring','Går inn og bestemmer senere']], ['You do not know where the stop loss should be. What do you do?', ['Skip the trade','Take the trade anyway','Use twice the leverage','Enter and decide later']]),
    Qz(['Hvorfor føre journal?', ['For å lære av tradene og se hva som virker','Fordi børsen krever det','For å slippe stop loss','For å få bedre priser']], ['Why keep a journal?', ['To learn from trades and see what works','Because the exchange requires it','To avoid using a stop loss','To get better prices']]),
    Qz(['Hva er ofte det vanskeligste med trading?', ['Å være disiplinert og følge planen hver gang','Å finne en børs','Å forstå hva en graf er','Å skaffe mange skjermer']], ['What is often the hardest part of trading?', ['Being disciplined and following the plan every time','Finding an exchange','Understanding what a chart is','Getting lots of screens']])]),
 ]},
 {id:'m2', no:'Ordene du trenger', en:'The words you need', lessons:[
  Lz('t-market', {terms:['bitcoin','satoshi','supply','altcoin','stablecoin','exchange','mcap','bull','fomo','fud']},
   ['Markedet', 'Disse ordene dukker opp hele tiden i nyheter og på grafer. Les gjennom forklaringene. Ordlisten-fanen har alle sammen hvis du trenger dem igjen.'],
   ['The market', 'These words show up all the time in news and on charts. Read through the explanations. The Glossary tab has all of them if you need them again.'],
   [Qz(['Hvor mange satoshi er det i én bitcoin?', ['100 millioner','1 million','21 millioner','1 000']], ['How many satoshi are there in one bitcoin?', ['100 million','1 million','21 million','1,000']]),
    Qz(['Hva er en stablecoin?', ['En kryptovaluta som skal holde fast verdi, ofte 1 dollar','En mynt som ikke kan selges','En aksje i en kryptobørs','Bitcoin på en annen blokkjede']], ['What is a stablecoin?', ['A cryptocurrency meant to hold a fixed value, often 1 dollar','A coin that cannot be sold','A share in a crypto exchange','Bitcoin on another blockchain']]),
    Qz(['Hva betyr FUD?', ['Skremmende rykter eller nyheter som får folk til å selge','Et kjøpssignal','En type ordre','En børs uten gebyrer']], ['What does FUD mean?', ['Scary rumours or news that make people sell','A buy signal','A type of order','An exchange without fees']]),
    Qz(['Hvor mange bitcoin kan det maksimalt finnes?', ['21 millioner','100 millioner','Ubegrenset','1 million']], ['What is the maximum number of bitcoin that can exist?', ['21 million','100 million','Unlimited','1 million']])]),
  Lz('t-trading', {terms:['long','short','spot','leverage','margin','roe','daytrade','swing','positional']},
   ['Måter å trade på', 'Her er ordene for hvordan en trade er satt opp, og hvor lenge den varer.'],
   ['Ways to trade', 'These are the words for how a trade is set up, and how long it lasts.'],
   [Qz(['Du tror prisen skal falle. Hvilken posisjon passer?', ['Short','Long','Spot-kjøp','Hold for alltid']], ['You think the price will fall. Which position fits?', ['Short','Long','Spot buy','Hold forever']]),
    Qz(['Du har 1 000 kr og åpner en posisjon på 5 000 kr. Hvilken giring bruker du?', ['5x','2x','10x','Ingen giring']], ['You have 1,000 and open a 5,000 position. What leverage are you using?', ['5x','2x','10x','No leverage']]),
    Qz(['Hva er margin?', ['Egenkapitalen børsen holder av når du bruker giring','Gebyret børsen tar','Forskjellen mellom kjøps- og salgspris','Gevinsten etter skatt']], ['What is margin?', ['The collateral the exchange sets aside when you use leverage','The fee the exchange charges','The gap between buy and sell price','Profit after tax']]),
    Qz(['Hva kjennetegner swing trading?', ['Du holder trades fra dager til uker','Du lukker alt samme dag','Du holder i mange år','Du trader bare i helgene']], ['What characterises swing trading?', ['You hold trades from days to weeks','You close everything the same day','You hold for many years','You only trade at weekends']])]),
  Lz('t-chart', {terms:['candle','ohlc','wick','volume','volatility','chg','ath']},
   ['Grafen', 'Ordene du trenger for å lese en prisgraf. Neste modul går dypere inn på candlesticks.'],
   ['The chart', 'The words you need to read a price chart. The next module goes deeper into candlesticks.'],
   [Qz(['Hva står OHLC for?', ['Open, High, Low, Close','Order, Hold, Leverage, Cash','Open, Hold, Long, Close','Over, High, Low, Change']], ['What does OHLC stand for?', ['Open, High, Low, Close','Order, Hold, Leverage, Cash','Open, Hold, Long, Close','Over, High, Low, Change']]),
    Qz(['Hva betyr høy volatilitet?', ['Prisen svinger mye og raskt','Prisen står stille','Mange kjøper samtidig','Børsen er stengt']], ['What does high volatility mean?', ['The price swings a lot and fast','The price stands still','Many buy at the same time','The exchange is closed']]),
    Qz(['Hva viser volum?', ['Hvor mye som er handlet i en periode','Hvor høy prisen er','Hvor mange mynter som finnes','Hvor gammel mynten er']], ['What does volume show?', ['How much was traded in a period','How high the price is','How many coins exist','How old the coin is']]),
    Qz(['En grønn candle betyr at …', ['Prisen endte høyere enn den startet i perioden','Prisen falt','Børsen var åpen','Volumet var lavt']], ['A green candle means that …', ['The price ended higher than it started in the period','The price fell','The exchange was open','Volume was low']])]),
 ]},
 {id:'m3', no:'Candlesticks', en:'Candlesticks', lessons:[
  Lz('c-anatomy', {fig:'anatomy', tryTab:'analyse'},
   ['Slik leser du en candle', 'En candle oppsummerer én tidsperiode, for eksempel én time eller fire timer.\n\n- **Kroppen** er den tykke delen: fra åpningspris til sluttpris.\n- **Wickene** er de tynne strekene: de viser høyeste og laveste pris i perioden.\n- **Grønn**: perioden endte høyere enn den startet. **Rød**: den endte lavere.\n\nEn linjegraf viser bare sluttprisene. En candle viser i tillegg hvor langt prisen ble presset opp og ned underveis, og det sier mye om kampen mellom kjøpere og selgere. Bytter du tidsramme (15 min, 1 t, 4 t, 1 d), dekker hver candle en annen lengde.'],
   ['How to read a candle', 'A candle sums up one time period, for example one hour or four hours.\n\n- The **body** is the thick part: from opening price to closing price.\n- The **wicks** are the thin lines: they show the highest and lowest price in the period.\n- **Green**: the period ended higher than it started. **Red**: it ended lower.\n\nA line chart only shows closing prices. A candle also shows how far price was pushed up and down along the way, which says a lot about the fight between buyers and sellers. Switch timeframe (15 min, 1h, 4h, 1d) and each candle covers a different length.'],
   [Qz(['Hva viser kroppen på en candle?', ['Fra åpningspris til sluttpris','Høyeste og laveste pris','Volumet','Antall handler']], ['What does the body of a candle show?', ['From opening price to closing price','Highest and lowest price','Volume','Number of trades']]),
    Qz(['Hva viser wickene?', ['Høyeste og laveste pris i perioden','Åpningsprisen','Gjennomsnittsprisen','Gebyret']], ['What do the wicks show?', ['Highest and lowest price in the period','The opening price','The average price','The fee']]),
    Qz(['Hvorfor gir candles mer informasjon enn en linjegraf?', ['De viser også hvor langt prisen ble presset opp og ned','De viser fremtidig pris','De er alltid mer nøyaktige i tid','De viser bare volum']], ['Why do candles give more information than a line chart?', ['They also show how far price was pushed up and down','They show the future price','They are always more precise in time','They only show volume']]),
    Qz(['På en 4-timersgraf dekker hver candle …', ['Fire timer med handel','Én dag','Fire minutter','Fire uker']], ['On a 4-hour chart each candle covers …', ['Four hours of trading','One day','Four minutes','Four weeks']])]),
  Lz('c-wicks', {fig:'wicks', tryTab:'analyse'},
   ['Wicks forteller hvem som vant', 'En wick er et spor etter en kamp som ble tapt.\n\n- **Lang nedre wick**: selgerne presset prisen langt ned, men kjøperne slo tilbake og dro den opp igjen. Kjøperne vant runden. Ofte et **bullish** tegn, særlig ved support.\n- **Lang øvre wick**: kjøperne presset opp, men selgerne tok over og presset den ned. Ofte **bearish**, særlig ved resistance.\n\nÉn wick alene er ingen garanti. Den blir viktig når den dukker opp på et nivå du allerede har tegnet.\n\nI appen: grafen merker lange wicks med W.'],
   ['Wicks tell you who won', 'A wick is the trace of a fight that was lost.\n\n- **Long lower wick**: sellers pushed the price far down, but buyers struck back and pulled it up again. Buyers won the round. Often a **bullish** sign, especially at support.\n- **Long upper wick**: buyers pushed up, but sellers took over and pushed it down. Often **bearish**, especially at resistance.\n\nA single wick is no guarantee. It matters when it appears at a level you have already drawn.\n\nIn the app: the chart marks long wicks with W.'],
   [Qz(['Hva betyr en lang nedre wick?', ['Selgerne presset ned, men kjøperne tok prisen opp igjen','Prisen falt hele perioden','Børsen hadde tekniske problemer','Det var ingen handel']], ['What does a long lower wick mean?', ['Sellers pushed down, but buyers took the price back up','The price fell the whole period','The exchange had technical problems','There was no trading']]),
    Qz(['En lang øvre wick ved resistance er ofte …', ['Bearish','Bullish','Alltid nøytral','Et tegn på at børsen stenger']], ['A long upper wick at resistance is often …', ['Bearish','Bullish','Always neutral','A sign the exchange is closing']]),
    Qz(['Når blir en wick ekstra viktig?', ['Når den dukker opp på et nivå du har tegnet','Når den er rød','Når det er helg','Når den er kort']], ['When does a wick matter most?', ['When it appears at a level you have drawn','When it is red','At weekends','When it is short']]),
    Qz(['Er én lang wick en garanti for at prisen snur?', ['Nei, det er et tegn, ikke en garanti','Ja, alltid','Ja, hvis den er grønn','Ja, på dagsgrafen']], ['Is one long wick a guarantee that price will turn?', ['No, it is a sign, not a guarantee','Yes, always','Yes, if it is green','Yes, on the daily chart']])]),
  Lz('c-hammer', {fig:'hammer', tryTab:'analyse'},
   ['Hammer og shooting star', '**Hammer** ligner en hammer: liten kropp øverst og en lang nedre wick, minst dobbelt så lang som kroppen. Den kommer etter et fall og viser at kjøperne begynner å ta over. Mulig bunn.\n\n**Shooting star** er speilbildet: liten kropp nederst og en lang øvre wick, etter en oppgang. Selgerne stoppet kjøperne. Mulig topp.\n\nBegge er sterkest ved et viktig nivå, og bekreftes ofte av at neste candle går samme vei.\n\nI appen: grafen merker dem med H og S.'],
   ['Hammer and shooting star', 'A **hammer** looks like one: small body at the top and a long lower wick, at least twice the length of the body. It comes after a decline and shows buyers starting to take over. A possible bottom.\n\nA **shooting star** is the mirror image: small body at the bottom and a long upper wick, after a rally. Sellers stopped the buyers. A possible top.\n\nBoth are strongest at an important level, and are often confirmed when the next candle moves the same way.\n\nIn the app: the chart marks them with H and S.'],
   [Qz(['Hvordan ser en hammer ut?', ['Liten kropp og lang nedre wick','Stor kropp uten wicks','Lang øvre wick og liten kropp nederst','To like store candles']], ['What does a hammer look like?', ['Small body and long lower wick','Big body with no wicks','Long upper wick with a small body at the bottom','Two candles of equal size']]),
    Qz(['Hvor dukker en hammer typisk opp?', ['Etter et fall, som en mulig bunn','Midt i en sterk oppgang','Bare i helgene','Rett etter en breakout']], ['Where does a hammer typically appear?', ['After a decline, as a possible bottom','In the middle of a strong rally','Only at weekends','Right after a breakout']]),
    Qz(['Hva er en shooting star?', ['Kort kropp nederst og lang wick over, etter en oppgang','En hammer etter et fall','En helt grønn candle','En candle uten kropp']], ['What is a shooting star?', ['A candle with a long upper wick after a rally','A hammer after a decline','A fully green candle','A candle with no body']]),
    Qz(['Hva gjør signalet sterkere?', ['At det kommer ved et viktig nivå og bekreftes av neste candle','At det er rødt','At volumet er null','At det kommer om natten']], ['What makes the signal stronger?', ['Appearing at an important level and being confirmed by the next candle','Being red','Zero volume','Appearing at night']])]),
  Lz('c-engulf', {fig:'engulf', tryTab:'analyse'},
   ['Engulfing', '**Engulfing** betyr «sluker». Det er to candles der kroppen til den andre er større enn og dekker hele kroppen til den første.\n\n- **Bullish engulfing**: en rød candle fulgt av en større grønn som dekker den. Kjøperne tok over med kraft.\n- **Bearish engulfing**: en grønn candle fulgt av en større rød. Selgerne tok over.\n\nMønsteret viser at forrige bevegelse ble overkjørt, og kan varsle at retningen snur. Også her er det mest verdt ved et nivå.\n\nI appen: grafen merker det med E.'],
   ['Engulfing', '**Engulfing** means "swallowing". Two candles where the body of the second is bigger than and covers the whole body of the first.\n\n- **Bullish engulfing**: a red candle followed by a bigger green one that covers it. Buyers took over with force.\n- **Bearish engulfing**: a green candle followed by a bigger red one. Sellers took over.\n\nThe pattern shows the previous move was overrun and can warn that direction is turning. Again, it is worth most at a level.\n\nIn the app: the chart marks it with E.'],
   [Qz(['Hva er en bullish engulfing?', ['En rød candle fulgt av en større grønn som dekker den','To grønne candles på rad','En grønn fulgt av en større rød','En lang wick oppover']], ['What is a bullish engulfing?', ['A red candle followed by a bigger green one that covers it','Two green candles in a row','A green followed by a bigger red','A candle with a long upper wick']]),
    Qz(['Hva kan engulfing varsle?', ['At retningen snur','At børsen stenger','At volumet faller','At prisen står stille']], ['What can engulfing warn of?', ['That direction is turning','That the exchange is closing','That volume is falling','That price is flat']]),
    Qz(['I en bearish engulfing er den andre candlen …', ['Rød og større enn den første','Grønn og mindre','Grønn og større','Helt uten kropp']], ['In a bearish engulfing the second candle is …', ['Red and bigger than the first','Green and smaller','Green and bigger','Without a body']]),
    Qz(['Hva betyr ordet «engulf»?', ['Å sluke eller dekke helt','Å stige','Å vente','Å dele']], ['What does the word "engulf" mean?', ['To swallow or fully cover','To rise','To wait','To split']])]),
 ]},
 {id:'m4', no:'Support og resistance', en:'Support and resistance', lessons:[
  Lz('s-what', {fig:'sr', tryTab:'analyse'},
   ['Hva er support og resistance?', 'Prisen beveger seg ikke helt tilfeldig. Noen nivåer går igjen fordi mange kjøpere eller selgere venter der.\n\n- **Support**: et nivå under prisen der kjøperne har vært sterkere enn selgerne. Prisen har en tendens til å stoppe opp eller snu opp her.\n- **Resistance**: et nivå over prisen der selgerne har vært sterkest. Prisen har en tendens til å stoppe opp eller snu ned.\n\nNivåene kan være vannrette linjer, skrå trendlinjer eller bredere soner (ofte kalt supply- og demand-soner). Mange erfarne tradere bruker nesten bare dette verktøyet, men nybegynnere hopper ofte over det.'],
   ['What are support and resistance?', 'Price does not move completely at random. Some levels repeat because many buyers or sellers are waiting there.\n\n- **Support**: a level below price where buyers have been stronger than sellers. Price tends to pause or turn up here.\n- **Resistance**: a level above price where sellers have been strongest. Price tends to pause or turn down.\n\nLevels can be horizontal lines, sloping trendlines or wider zones (often called supply and demand zones). Many experienced traders use almost nothing else, yet beginners often skip it.'],
   [Qz(['Hva er support?', ['Et nivå der kjøperne har vært sterkere enn selgerne','Et nivå der selgerne dominerer','Den høyeste prisen noensinne','Et gebyr på børsen']], ['What is support?', ['A level where buyers have been stronger than sellers','A level where sellers dominate','The highest price ever','An exchange fee']]),
    Qz(['Hva skjer ofte ved resistance?', ['Prisen stopper opp eller snur ned','Prisen stiger alltid videre','Børsen stenger','Det blir ingen handel']], ['What often happens at resistance?', ['Price pauses or turns down','Price always keeps rising','The exchange closes','Trading stops']]),
    Qz(['Hvilken er IKKE en form for nivå i leksjonen?', ['Et fargeskala-nivå','Vannrett linje','Trendlinje','Supply- eller demand-sone']], ['Which is NOT a form of level in the lesson?', ['A colour-scale level','Horizontal line','Trendline','Supply or demand zone']]),
    Qz(['Hvorfor går nivåer igjen?', ['Mange kjøpere eller selgere venter på de samme prisene','Børsen bestemmer dem','Det er rent tilfeldig','Myndighetene setter dem']], ['Why do levels repeat?', ['Many buyers or sellers wait at the same prices','The exchange sets them','It is pure chance','The authorities set them']])]),
  Lz('s-draw', {tryTab:'analyse'},
   ['Slik tegner du nivåer', '1. **Zoom ut** til du ser de siste ukene eller månedene.\n2. Se etter steder der prisen har **snudd flere ganger** på omtrent samme pris: flere bunner gir support, flere topper gir resistance.\n3. Tegn en linje, eller en smal sone, gjennom dem.\n\nGode nivåer er **opplagte**. Må du lete lenge eller tvinge en linje på plass, betyr den trolig lite. Tenk på nivåer som soner, ikke eksakte priser: prisen kan stikke litt gjennom før den snur.\n\nI appen: trykk «Tegn nivå» og klikk i grafen. Appen finner også nivåer selv og viser hvor mange ganger hvert er testet.'],
   ['How to draw levels', '1. **Zoom out** until you see the last weeks or months.\n2. Look for places where price has **turned several times** at about the same price: several bottoms make support, several tops make resistance.\n3. Draw a line, or a narrow zone, through them.\n\nGood levels are **obvious**. If you have to search for long or force a line into place, it is probably not important. Think of levels as zones, not exact prices: price can poke through a little before turning.\n\nIn the app: press "Draw level" and click the chart. The app also finds levels itself and shows how many times each has been tested.'],
   [Qz(['Hva er første steg?', ['Å zoome ut','Å zoome helt inn på 1-minuttsgrafen','Å kjøpe først','Å lese nyheter']], ['What is the first step?', ['Zoom out','Zoom all the way into the 1-minute chart','Buy first','Read the news']]),
    Qz(['Hva kjennetegner en god support?', ['Prisen har snudd opp flere ganger på omtrent samme nivå','Prisen har passert den én gang','Den ligger på et rundt tall','Den er tegnet med rødt']], ['What marks a good support?', ['Price has turned up several times at about the same level','Price has passed it once','It sits at a round number','It is drawn in red']]),
    Qz(['Du må lete lenge etter et nivå. Hva sier det?', ['Det er sannsynligvis ikke viktig','Det er ekstra sterkt','Du må bruke giring','Du bør kjøpe der']], ['You have to search for a long time to find a level. What does that tell you?', ['It is probably not important','It is extra strong','You must use leverage','You should buy there']]),
    Qz(['Hvorfor tenke på nivåer som soner?', ['Prisen kan stikke litt gjennom før den snur','Fordi linjer er vanskelige å tegne','Fordi børsen krever det','Fordi soner aldri brytes']], ['Why think of levels as zones?', ['Price can poke through a little before turning','Because lines are hard to draw','Because the exchange requires it','Because zones never break']])]),
  Lz('s-break', {tryTab:'analyse'},
   ['Breakout og breakdown', 'Ingen nivåer holder for alltid.\n\n- **Breakout**: prisen lukker tydelig over resistance. Ofte fordi kjøperne har bygget seg opp, og det er få selgere igjen på nivået. Kan gi en kraftig bevegelse opp.\n- **Breakdown**: prisen lukker tydelig under support. Selgerne vant, og fallet kan bli raskt.\n\nEn nyttig tommelfingerregel: **hvert nytt treff sliter på nivået**, fordi ordrene som forsvarer det blir brukt opp. Et nivå som er truffet fem ganger, brytes lettere enn et som er truffet to ganger.\n\nI appen: grafen viser «3×», «5×» osv. ved hvert nivå.'],
   ['Breakout and breakdown', 'No level holds forever.\n\n- **Breakout**: price closes clearly above resistance. Often because buyers have built up and few sellers are left at the level. Can lead to a strong move up.\n- **Breakdown**: price closes clearly below support. Sellers won, and the drop can be fast.\n\nA useful rule of thumb: **the more often a level is tested, the weaker it gets**, because the orders defending it get used up. A level hit five times breaks more easily than one hit twice.\n\nIn the app: the chart shows "3×", "5×" and so on at each level.'],
   [Qz(['Hva er en breakout?', ['Prisen lukker tydelig over resistance','Prisen faller under support','Prisen står stille','En lang wick']], ['What is a breakout?', ['Price closes clearly above resistance','Price falls below support','Price stands still','A long wick']]),
    Qz(['Hva skjer med et nivå som testes mange ganger?', ['Det blir svakere','Det blir sterkere for hver gang','Ingenting','Det forsvinner fra grafen']], ['What happens to a level that is tested many times?', ['It gets weaker','It gets stronger each time','Nothing','It disappears from the chart']]),
    Qz(['Hva er en breakdown?', ['Prisen lukker tydelig under support','Prisen bryter opp gjennom resistance','En grønn candle','En retest']], ['What is a breakdown?', ['Price closes clearly below support','Price breaks up through resistance','A green candle','A retest']]),
    Qz(['Hvorfor blir et nivå svakere av mange tester?', ['Ordrene som forsvarer det blir brukt opp','Fordi grafen zoomer ut','Fordi volumet alltid øker','Det blir ikke svakere']], ['Why does a level get weaker from many tests?', ['The orders defending it get used up','Because the chart zooms out','Because volume always rises','It does not get weaker']])]),
  Lz('s-flip', {fig:'retest', tryTab:'analyse'},
   ['Rollebytte og retest', 'Når et nivå brytes, bytter det ofte rolle:\n- Brutt resistance blir ny **support**.\n- Brutt support blir ny **resistance**.\n\nDette kalles en **level flip**. Ofte kommer prisen tilbake og tester det brutte nivået fra den andre siden. Det kalles en **retest**.\n\nEt klassisk oppsett for long:\n1. Resistance brytes.\n2. Prisen faller tilbake til nivået.\n3. Nivået holder som support.\n4. Prisen fortsetter opp.\n\nRetesten bekrefter bruddet og gir et tydelig sted for stop loss: like under nivået.\n\nI appen: snudde nivåer merkes ⇅, og en holdt retest gir et oppsett.'],
   ['Role swap and retest', 'When a level breaks it often swaps role:\n- Broken resistance becomes new **support**.\n- Broken support becomes new **resistance**.\n\nThis is called a **level flip**. Often price comes back and tests the broken level from the other side. That is a **retest**.\n\nA classic long setup:\n1. Resistance breaks.\n2. Price drops back to the level.\n3. The level holds as support.\n4. Price continues up.\n\nThe retest confirms the break and gives a clear place for the stop loss: just below the level.\n\nIn the app: flipped levels are marked ⇅, and a held retest produces a setup.'],
   [Qz(['Hva skjer ofte med brutt resistance?', ['Den blir ny support','Den forsvinner','Den blir enda sterkere resistance','Den blir en wick']], ['What often happens to broken resistance?', ['It becomes new support','It disappears','It becomes even stronger resistance','It becomes a wick']]),
    Qz(['Hva er en retest?', ['Prisen kommer tilbake til et brutt nivå og tester det fra den andre siden','Å tegne nivået på nytt','Å kjøpe to ganger','En ny type candle']], ['What is a retest?', ['Price returns to a broken level and tests it from the other side','Redrawing the level','Buying twice','A new type of candle']]),
    Qz(['Hvor er det naturlig å sette stop loss etter en holdt retest av brutt resistance?', ['Like under nivået','Langt over nivået','Midt i forrige range','Ingen stop trengs']], ['Where is a natural stop loss after a held retest of broken resistance?', ['Just below the level','Far above the level','In the middle of the old range','No stop needed']]),
    Qz(['Hva kalles det når support blir resistance?', ['Level flip','Engulfing','FOMO','Margin call']], ['What is it called when support becomes resistance?', ['Level flip','Engulfing','FOMO','Margin call']])]),
  Lz('s-entries', {tryTab:'analyse'},
   ['Entries ved nivåer', '**Long** (du tror prisen skal opp):\n- Prisen er ved support, eller ved en brutt resistance som har blitt support.\n- Det kommer en avvisning: lang nedre wick, hammer eller bullish engulfing.\n\n**Short** (du tror prisen skal ned):\n- Prisen avvises ved resistance (lang øvre wick, shooting star, bearish engulfing), eller\n- en support brytes, prisen tester den nedenfra, og den holder som resistance.\n\nI praksis er det vanskeligere enn det høres ut. Derfor teller trenden og flere bekreftelser. Jo flere grunner som peker samme vei, jo bedre. Det kalles **confluence**.'],
   ['Entries at levels', '**Long** (you think price will rise):\n- Price is at support, or at broken resistance that has become support.\n- A rejection appears: long lower wick, hammer or bullish engulfing.\n\n**Short** (you think price will fall):\n- Price is rejected at resistance (long upper wick, shooting star, bearish engulfing), or\n- a support breaks, price tests it from below, and it holds as resistance.\n\nIn practice it is harder than it sounds. That is why the trend and extra confirmation count. The more reasons pointing the same way, the better. This is called **confluence**.'],
   [Qz(['Hva er et typisk long-signal ved support?', ['En lang nedre wick eller hammer','En lang øvre wick','At prisen bryter ned','Mye rødt volum']], ['What is a typical long signal at support?', ['A long lower wick or a hammer','A long upper wick','Price breaking down','Lots of red volume']]),
    Qz(['Hva er en mulig short-entry?', ['Support brytes, testes nedenfra og holder som resistance','Prisen spretter opp fra support','En hammer etter et fall','Bullish engulfing']], ['What is a possible short entry?', ['Support breaks, is tested from below and holds as resistance','Price bounces up from support','A hammer after a decline','Bullish engulfing']]),
    Qz(['Hva betyr confluence?', ['Flere grunner som peker samme vei','At to børser slår seg sammen','En type ordre','At prisen står stille']], ['What does confluence mean?', ['Several reasons pointing the same way','Two exchanges merging','A type of order','Price standing still']]),
    Qz(['Du tror prisen skal opp. Hva slags trade er det?', ['Long','Short','Breakdown','Stop loss']], ['You think the price will rise. What kind of trade is that?', ['Long','Short','Breakdown','Stop loss']])]),
 ]},
 {id:'m5', no:'Risikostyring', en:'Risk management', lessons:[
  Lz('r-percent', {tryTab:'plan'},
   ['Hvor mye kan én trade koste?', 'Det viktigste tallet i trading er ikke hvor mye du kan tjene, men hvor mye du kan tape på én trade.\n\nEn vanlig regel er **maks 3–5 % av kontoen per trade**. 3 % er forsiktig, 5 % er øvre grense.\n\nMerk: dette er **tapet** hvis stop loss treffes, ikke størrelsen på posisjonen. Har du 20 000 kr og risikerer 3 %, kan du tape 600 kr på traden. Selve posisjonen kan være større, så lenge tapet ved stop loss blir 600 kr.\n\nDe fleste som trader uten en slik grense, mister før eller siden kontoen etter noen få dårlige trades.'],
   ['How much can one trade cost?', 'The most important number in trading is not how much you can make, but how much you can lose on one trade.\n\nA common rule is **at most 3–5% of the account per trade**. 3% is careful, 5% is the upper limit.\n\nNote: this is the **loss** if the stop loss is hit, not the size of the position. With 20,000 and 3% risk you can lose 600 on the trade. The position itself can be bigger, as long as the loss at the stop is 600.\n\nMost people who trade without such a limit sooner or later lose the account after a few bad trades.'],
   [Qz(['Hva er en vanlig grense for risiko per trade?', ['3–5 % av kontoen','25 %','50 %','Hele kontoen']], ['What is a common limit for risk per trade?', ['3–5% of the account','25%','50%','The whole account']]),
    Qz(['Du har 20 000 kr og risikerer 3 %. Hva er maks tap på traden?', ['600 kr','3 000 kr','60 kr','6 000 kr']], ['You have 20,000 and risk 3%. What is the maximum loss on the trade?', ['600','3,000','60','6,000']]),
    Qz(['Hva gjelder 3–5 %-grensen?', ['Hvor mye du taper hvis stop loss treffes','Hvor stor posisjonen er','Hvor mye prisen må stige','Gebyret']], ['What does the 3–5% limit apply to?', ['How much you lose if the stop loss is hit','How big the position is','How much price must rise','The fee']]),
    Qz(['Hva er det viktigste tallet ifølge leksjonen?', ['Hvor mye du kan tape på én trade','Hvor mye du kan tjene','Prisen på bitcoin','Antall trades per dag']], ['What is the most important number according to the lesson?', ['How much you can lose on one trade','How much you can make','The price of bitcoin','Trades per day']])]),
  Lz('r-size', {tryTab:'plan'},
   ['Posisjonsstørrelse', 'Når du vet hvor mye du tåler å tape, regner du ut hvor stor posisjonen kan være:\n\n**Posisjon = beløp du risikerer ÷ avstand til stop loss (i %)**\n\nEksempel: du risikerer 600 kr, og stop loss ligger 2 % under entry. Da kan posisjonen være 600 ÷ 0,02 = **30 000 kr**.\n\nHar du bare 20 000 kr, krever det 1,5x giring. Flytter du stop loss lenger unna, blir posisjonen mindre. Rekkefølgen er: grafen bestemmer stop loss, stop loss bestemmer posisjonen, og posisjonen avgjør om du trenger giring. **Størrelsen på posisjonen betyr mer enn giringen.**\n\nI appen: Plan og risiko regner ut dette for deg.'],
   ['Position size', 'Once you know how much you can afford to lose, work out how big the position can be:\n\n**Position = amount at risk ÷ distance to stop loss (in %)**\n\nExample: you risk 600 and the stop loss is 2% below entry. The position can then be 600 ÷ 0.02 = **30,000**.\n\nWith only 20,000 that needs 1.5x leverage. Move the stop further away and the position gets smaller. The order is: the chart sets the stop loss, the stop loss sets the position, and the position decides whether you need leverage. **Position size matters more than leverage.**\n\nIn the app: Plan & risk does this for you.'],
   [Qz(['Hva er formelen for posisjonsstørrelse?', ['Beløp du risikerer ÷ avstand til stop loss','Kontoen × giringen','Target − entry','Pris × antall trades']], ['What is the formula for position size?', ['Amount at risk ÷ distance to stop loss','Account × leverage','Target − entry','Price × number of trades']]),
    Qz(['Du risikerer 500 kr og stop loss er 5 % unna. Hvor stor kan posisjonen være?', ['10 000 kr','2 500 kr','500 kr','25 000 kr']], ['You risk 500 and the stop loss is 5% away. How big can the position be?', ['10,000','2,500','500','25,000']]),
    Qz(['Hva skjer med posisjonen hvis stop loss flyttes lenger unna?', ['Den blir mindre','Den blir større','Ingenting','Den dobles']], ['What happens to the position if the stop loss moves further away?', ['It gets smaller','It gets bigger','Nothing','It doubles']]),
    Qz(['Hva bestemmer hvor stop loss skal ligge?', ['Grafen (teknisk analyse)','Hvor mye giring du vil bruke','Magefølelsen','Hvor mange mynter du har']], ['What decides where the stop loss goes?', ['The chart (technical analysis)','How much leverage you want','Your gut feeling','How many coins you own']])]),
  Lz('r-stop', {tryTab:'plan'},
   ['Stop loss', 'Stop loss er prisen der ideen din er bevist feil. Den kalles også **invalidation**.\n\n- Sett den der traden ikke lenger gir mening, typisk litt på andre siden av nivået du handler fra. Long ved support: litt under supporten og under siste wick.\n- Ikke velg et tilfeldig prosenttall fordi det «føles greit».\n- Når den treffes: **ut med en gang**, uten å forhandle med deg selv.\n\nEn trade uten stop loss er ikke en plan, men et veddemål.'],
   ['Stop loss', 'The stop loss is the price where your idea is proven wrong. It is also called **invalidation**.\n\n- Put it where the trade no longer makes sense, typically a little on the other side of the level you trade from. Long at support: a little below the support and below the last wick.\n- Do not pick a random percentage because it "feels right".\n- When it is hit: **out immediately**, without negotiating with yourself.\n\nA trade without a stop loss is not a plan, it is a bet.'],
   [Qz(['Hva er stop loss?', ['Prisen der ideen bak traden er bevist feil','Prisen der du tar gevinst','Prisen du kjøpte på','Gebyret ved salg']], ['What is a stop loss?', ['The price where the idea behind the trade is proven wrong','The price where you take profit','The price you bought at','The fee when selling']]),
    Qz(['Hvor setter du stop loss på en long ved support?', ['Litt under supporten og siste wick','Rett over entry','På et tilfeldig prosenttall','Over neste resistance']], ['Where do you put the stop on a long at support?', ['A little below the support and the last wick','Just above entry','At a random percentage','Above the next resistance']]),
    Qz(['Hva gjør du når stop loss treffes?', ['Går ut med en gang','Flytter den lenger unna','Kjøper mer','Venter en uke']], ['What do you do when the stop loss is hit?', ['Get out immediately','Move it further away','Buy more','Wait a week']]),
    Qz(['Hva er en trade uten stop loss?', ['Et veddemål, ikke en plan','En trygg trade','En swing trade','Et krav fra børsen']], ['What is a trade without a stop loss?', ['A bet, not a plan','A safe trade','A swing trade','An exchange requirement']])]),
  Lz('r-target', {fig:'rr', tryTab:'plan'},
   ['Target og R:R', '**Target** er der du venter at prisen kan komme før den møter motstand, typisk neste resistance for en long eller neste support for en short.\n\n**R:R** (risk/reward) sammenligner mulig gevinst med mulig tap:\n\nR:R = (target − entry) ÷ (entry − stop loss)\n\nEksempel: entry 100, stop loss 96, target 108. Du setter 4 på spill for å hente 8, altså **2:1**: gevinsten kan bli dobbelt så stor som tapet.\n\nRegn alltid ut R:R før du går inn. Ligger den under 1,5:1, er traden sjelden verdt det.'],
   ['Target and R:R', 'The **target** is where you expect price can get before it meets resistance, typically the next resistance for a long or the next support for a short.\n\n**R:R** (risk/reward) compares possible gain with possible loss:\n\nR:R = (target − entry) ÷ (entry − stop loss)\n\nExample: entry 100, stop loss 96, target 108. You risk 4 to make 8, so **2:1**. You can make twice what you risk.\n\nAlways work out the R:R before entering. Below 1.5:1 the trade is rarely worth it.'],
   [Qz(['Hvor setter du vanligvis target for en long?', ['Ved neste resistance','Ved neste support under','Ved entry','Tilfeldig']], ['Where do you usually set the target for a long?', ['At the next resistance','At the next support below','At entry','At random']]),
    Qz(['Entry 100, stop 96, target 108. Hva er R:R?', ['2:1','1:2','4:1','1:1']], ['Entry 100, stop 96, target 108. What is the R:R?', ['2:1','1:2','4:1','1:1']]),
    Qz(['Hva sammenligner R:R?', ['Mulig gevinst mot mulig tap','Pris mot volum','Kjøp mot salg','Long mot short']], ['What does R:R compare?', ['Possible gain against possible loss','Price against volume','Buys against sells','Long against short']]),
    Qz(['Hvilken R:R er minst verdt å ta ifølge leksjonen?', ['0,8:1','2:1','3:1','1,5:1']], ['Which R:R is least worth taking according to the lesson?', ['0.8:1','2:1','3:1','1.5:1']])]),
  Lz('r-math', {tryTab:'demo'},
   ['Win rate og R:R henger sammen', 'Du trenger ikke vinne de fleste tradene for å tjene penger. Det som teller, er samspillet mellom **win rate** (hvor ofte du vinner) og **R:R**.\n\nWin raten du trenger for å gå i null er **1 ÷ (1 + R:R)**:\n- R:R 1:1 → 50 %\n- R:R 2:1 → 33 %\n- R:R 3:1 → 25 %\n\nMange profesjonelle vinner under halvparten av tradene, men tjener fordi gevinstene er større enn tapene.\n\nTapsrekker kommer uansett. Med 3 % risiko gir fem tap på rad rundt 14 % nedgang. Med 20 % risiko ville de samme fem tapene tatt over 67 % av kontoen. Lav risiko per trade er det som holder deg i spillet.\n\nI appen: Demotrading viser din win rate og hvilken du trenger.'],
   ['Win rate and R:R work together', 'You do not need to win most trades to make money. What counts is how **win rate** (how often you win) and **R:R** work together.\n\nThe win rate you need to break even is **1 ÷ (1 + R:R)**:\n- R:R 1:1 → 50%\n- R:R 2:1 → 33%\n- R:R 3:1 → 25%\n\nMany professionals win less than half their trades, yet make money because wins are bigger than losses.\n\nLosing streaks will come anyway. At 3% risk, five losses in a row is about a 14% drop. At 20% risk the same five losses would take over 67% of the account. Low risk per trade is what keeps you in the game.\n\nIn the app: Demo trading shows your win rate and the one you need.'],
   [Qz(['Hvilken win rate trenger du for å gå i null med R:R 2:1?', ['33 %','50 %','66 %','20 %']], ['What win rate do you need to break even at an R:R of 2:1?', ['33%','50%','66%','20%']]),
    Qz(['Kan du tjene penger med under 50 % win rate?', ['Ja, hvis R:R er god nok','Nei, aldri','Bare med giring','Bare på bitcoin']], ['Can you make money with a win rate below 50%?', ['Yes, if the R:R is good enough','No, never','Only with leverage','Only on bitcoin']]),
    Qz(['Med R:R 1:1, hvilken win rate trengs for å gå i null?', ['50 %','33 %','25 %','75 %']], ['At an R:R of 1:1, what win rate is needed to break even?', ['50%','33%','25%','75%']]),
    Qz(['Hvorfor er lav risiko per trade viktig ved tapsrekker?', ['Flere tap på rad tar bare en liten del av kontoen','Tapsrekker skjer da aldri','Børsen gir deg pengene tilbake','Det gir automatisk høyere win rate']], ['Why does low risk per trade matter in losing streaks?', ['Several losses in a row only take a small part of the account','Losing streaks never happen then','The exchange refunds you','It automatically raises your win rate']])]),
 ]},
 {id:'m6', no:'Sett det sammen', en:'Putting it together', lessons:[
  Lz('p-checklist', {tryTab:'plan'},
   ['Sjekklisten før hver trade', 'Gå gjennom denne før hver trade, også på demo:\n\n1. **Trend**: går traden med trenden?\n2. **Nivå**: er prisen ved et tydelig support- eller resistance-nivå?\n3. **Trigger**: hva er grunnen til å gå inn nå? (avvisning, mønster, breakout med retest)\n4. **Confluence**: peker flere ting samme vei?\n5. **Stop loss**: hvor er ideen feil?\n6. **Target**: hvor er neste nivå?\n7. **R:R**: minst 1,5:1?\n8. **Størrelse**: tap ved stop loss maks 3–5 % av kontoen?\n9. **Journal**: skriv ned hvorfor du tok traden.\n\nEr svaret nei på ett punkt, vent. Det kommer alltid en ny mulighet.\n\nI appen: sjekklisten ligger i Plan og risiko og fylles ut automatisk.'],
   ['The checklist before every trade', 'Go through this before every trade, demo included:\n\n1. **Trend**: is the trade with the trend?\n2. **Level**: is price at a clear support or resistance?\n3. **Trigger**: what is the reason to enter now? (rejection, pattern, breakout with retest)\n4. **Confluence**: do several things point the same way?\n5. **Stop loss**: where is the idea wrong?\n6. **Target**: where is the next level?\n7. **R:R**: at least 1.5:1?\n8. **Size**: loss at the stop at most 3–5% of the account?\n9. **Journal**: write down why you took the trade.\n\nIf the answer to any point is no, wait. There is always another opportunity.\n\nIn the app: the checklist lives in Plan & risk and fills itself in.'],
   [Qz(['Ett punkt på sjekklisten er «nei». Hva gjør du?', ['Venter på en bedre mulighet','Tar traden med dobbel størrelse','Hopper over stop loss','Tar traden uansett']], ['One point on the checklist is "no". What do you do?', ['Wait for a better opportunity','Take the trade at double size','Skip the stop loss','Take the trade anyway']]),
    Qz(['Hva er en entry trigger?', ['Grunnen til å gå inn akkurat nå','Prisen du selger på','Gebyret','En type graf']], ['What is an entry trigger?', ['The reason to enter right now','The price you sell at','The fee','A type of chart']]),
    Qz(['Hvilken minste R:R bruker sjekklisten?', ['1,5:1','0,5:1','1:2','10:1']], ['What minimum R:R does the checklist use?', ['1.5:1','0.5:1','1:2','10:1']]),

const gNorm = p => typeof p === 'string' ? {t:p, en:false, only:null} : p;
function gId(p){ let h = 5381; const s = gNorm(p).t; for(let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function greetSlot(hour){ const h = ((Math.floor(+hour) % 24) + 24) % 24; const s = GREET_SLOTS.find(([a, b]) => h >= a && h < b); return s ? s[2] : 'morning'; }
/* Pure picker: o = {hour, wd (0=Sun), market:'up'|'down'|'flat'|null, lang, recent:[ids], rnd} */
function greetPick(o){
  const R = o.rnd || Math.random, lang = o.lang === 'en' ? 'en' : 'no', recent = Array.isArray(o.recent) ? o.recent : [];
  const okLang = p => lang === 'en' ? p.en : p.only !== 'en';
  const usable = list => (Array.isArray(list) ? list : []).map(gNorm).filter(okLang);
  const choose = list => { const all = usable(list); if(!all.length) return []; const fresh = all.filter(p => !recent.includes(gId(p))); return fresh.length ? fresh : all.filter(p => gId(p) !== recent[0]).length ? all.filter(p => gId(p) !== recent[0]) : all; };
  const slot = greetSlot(o.hour); const roll = R(); let src = 'time', list = [], sub = null;
  const mk = ['up','down','flat'].includes(o.market) ? o.market : null;
  if(mk && roll < GREET_ODDS.market){ list = choose(GREETS.market[mk]); if(list.length) src = 'market'; }
  const wAt = mk ? GREET_ODDS.market : 0;
  if(src === 'time' && slot !== 'night' && roll >= wAt && roll < wAt + GREET_ODDS.weekday && GREETS.weekday[o.wd]){ list = choose(GREETS.weekday[o.wd]); if(list.length) src = 'weekday'; }
  if(src === 'time'){
    const pool = GREETS[slot];
    if(Array.isArray(pool)) list = choose(pool);
    else { const keys = Object.keys(pool).filter(k => usable(pool[k]).length); sub = keys[Math.floor(R() * keys.length)] || keys[0]; list = choose(pool[sub]); }
  }
  const p = list[Math.floor(R() * list.length)] || gNorm('Hello.');
  return {p, text:p.t, tr:p.tr ? p.tr[lang] : '', slot, sub, src, id:gId(p), lang};
}

/* Page glue: choose once per page load. Waits briefly (max ~3.5 s) for market data so a market line is possible. */
let GREET_CUR = null, GREET_ANIM = false, GREET_TIMER = 0; const GREET_T0 = Date.now();
function greetMarket(){ try{ if(!D.markets || !D.global) return null; const s = core(); if(s.mchg == null || !isFinite(s.mchg)) return null; const i = dirIdx(s.mchg); return i >= 3 ? 'up' : i <= 1 ? 'down' : 'flat'; }catch(e){ return null; } }
function greetEnsure(){
  if(GREET_CUR && (S.lang !== 'en' ? GREET_CUR.p.only !== 'en' : GREET_CUR.p.en)) return GREET_CUR;
  const ready = (D.markets && D.global) || Date.now() - GREET_T0 > 3500 || (D.st.mkt && D.st.mkt.s === 'err');
  if(!ready && !GREET_CUR){ if(!GREET_TIMER) GREET_TIMER = setTimeout(() => { GREET_TIMER = 0; const el = $('#motto'); if(el && !GREET_CUR) el.outerHTML = mottoHTML(); }, 3600); return null; }
  try{
    const now = new Date(); const recent = store.get('greetRecent', []);
    const r = greetPick({hour:now.getHours(), wd:now.getDay(), market:greetMarket(), lang:S.lang, recent});
    store.set('greetRecent', [r.id].concat((Array.isArray(recent) ? recent : []).filter(x => x !== r.id)).slice(0, GREET_RECENT));
    GREET_CUR = r; GREET_ANIM = true; return r;
  }catch(e){ logErr(e); return null; }
}
function mottoHTML(){
  const g = greetEnsure(); if(!g) return `<p class="motto wait" id="motto" aria-hidden="true">&nbsp;</p>`;
  const anim = GREET_ANIM; GREET_ANIM = false; const tr = g.p.tr ? g.p.tr[S.lang === 'en' ? 'en' : 'no'] : '';

}

/* =====================================================================
   MOTION: smooth page changes (View Transitions where the browser has
   them, a CSS fallback elsewhere), animated modals and sheets.
   Data refreshes never animate; only real navigation does.
   Everything is switched off when the device asks for reduced motion.
   ===================================================================== */
const reduceMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const A_CLASSES = ['a-fade','a-fwd','a-back','a-tab','a-next','a-prev','a-zin','a-zout'];
function animateIn(el, kind){
  if(!el || reduceMotion()) return; const pre = kind === 'tab' ? 'a-pre-tab' : 'a-pre';
  el.classList.remove(...A_CLASSES, 'a-pre', 'a-pre-tab'); el.classList.add(pre); clearTimeout(el._at); const tok = el._tok = (el._tok || 0) + 1;
  requestAnimationFrame(() => requestAnimationFrame(() => { if(el._tok !== tok) return; el.classList.remove(pre); el.classList.add('a-'+kind); el._at = setTimeout(() => el.classList.remove('a-'+kind), 500); }));
}
function withTransition(kind, update){
  const v = $('#view'); if(reduceMotion() || !v || !v.dataset.route){ update(); return; }
  v.classList.add(kind === 'tab' ? 'a-pre-tab' : 'a-pre'); update(); animateIn(v, kind);
}
function closeModal(){
  const r = $('#modal-root'), bg = r && r.querySelector('.modal-bg'); if(!bg){ if(r) r.innerHTML = ''; return; }
  if(reduceMotion()){ r.innerHTML = ''; return; } if(bg.classList.contains('out')) return;
  bg.classList.add('out'); setTimeout(() => { if(r.contains(bg)) r.innerHTML = ''; }, 210);
}
function closeSheet(){
  const r = $('#sheet-root'), bg = r && r.querySelector('.sheet-bg'); if(!bg){ if(r) r.innerHTML = ''; return; }
  if(reduceMotion()){ r.innerHTML = ''; return; } if(bg.classList.contains('out')) return;
  bg.classList.add('out'); setTimeout(() => { if(r.contains(bg)) r.innerHTML = ''; }, 230);
}

  if(w.type === 'buy'){ const fs = (w.fs||[]).map(([k, a]) => typeof a === 'string' && a.startsWith('pat:') ? t(k, t('pat.'+a.slice(4))) : a != null ? t(k, a) : t(k)); return `${w.lev ? t('ag_lev_why', w.lev) + ' ' : ''}${t('ag_why_buy')}: ${fs.join(' + ')}. ${t('ag_sl')} ${agFmt(w.sl)}, ${t('ag_tp').toLowerCase()} ${agFmt(w.tp)} (${t('ag_rr')} ${fmtNum(w.rr, 1)}).`; }

const agLiq = p => (p.lev||1) > 1 ? p.entry*(1 - 1/p.lev + AG.mmr) : 0;

function agLevFor(stopFrac, score){
  const liqCap = Math.floor(.92/(stopFrac + AG.mmr)); const want = score >= 4 ? 100 : score >= 3 ? 50 : 20;

}
function agBuy(sym, px, setup, an, at, bf){

  const eq = agEquity(st.lastPx || {}), stopFrac = (px - setup.sl)/px; if(stopFrac <= 0) return;
  const riskD = eq * (setup.score >= 3 ? AG.riskHi : AG.risk), lev = agLevFor(stopFrac, setup.score);
  let notional = riskD/stopFrac, margin = notional/lev; const maxM = Math.min(eq*AG.maxMargin, st.cash/(1 + AG.fee*lev));
  if(margin > maxM){ margin = maxM; notional = margin*lev; } if(notional < 10 || margin < 2) return;

  const bullK = (an.patterns||[]).filter(p => p.bias==='bull').map(p => p.kind).pop();

function agSell(sym, px, reason, at, bf){
  const st = agState, p = st.pos[sym]; if(!p) return; const lev = p.lev || 1, margin = agMargin(p), notional = p.qty*px;
  const fee = notional*(p.lev ? AG.fee : .001), funding = p.lev ? p.qty*p.entry*AG.funding*Math.max(0, (at - p.at)/(8*HOUR)) : 0;
  const payout = reason === 'liq' ? 0 : Math.max(0, margin + p.qty*(px - p.entry) - fee - funding);

  st.trades.unshift({at, side:'sell', sym, px, qty:p.qty, val:notional, margin, lev, fee:fee+funding, pnl, pnlPct:pnl/margin*100, entry:p.entry, why:{type:'sell', r:reason}, bf:!!bf}); st.trades = st.trades.slice(0, 400);

function agInit(cs){

  agState = {v:1, created:Date.now(), startAt, cash:AG.start, fees:0, pos:{}, trades:[], last, base, eq:[[startAt, AG.start, 1, 1]], lastPx:{}, notified:Date.now(), checked:0};
}
async function agentRun(){
  if(agBusy) return; agBusy = true; agErr = ''; agRefreshUI();
  try{
    const cs = {}; for(const s of AG.coins){ try{ const k = await loadCandles(s, AG.tf, true); cs[s] = k.candles; }catch(e){} await sleep(150); }
    if(!cs.BTC || Object.keys(cs).length < 5) throw new Error('candles');
    if(!agState) agInit(cs);
    const st = agState, now = Date.now(); AG.coins.forEach(s => { if(cs[s] && st.base[s] == null){ const k = cs[s][cs[s].length-2]; if(k){ st.base[s] = k.c; st.last[s] = k.t; } } });
    const times = new Set(); AG.coins.forEach(s => (cs[s]||[]).forEach(c => { if(c.t + HOUR <= now && c.t > (st.last[s] ?? Infinity)) times.add(c.t); }));
    const order = Array.from(times).sort((a,b) => a-b); const before = st.trades.length; let steps = 0;
    for(const T of order){
      const bf = T + HOUR < st.created; const px = {};
      for(const s of AG.coins){ const c = cs[s]; if(!c) continue; const i = c.findIndex(x => x.t === T); if(i < 0){ const pc = c.filter(x => x.t <= T).pop(); if(pc) px[s] = pc.c; continue; }
        const k = c[i]; px[s] = k.c; if(T <= (st.last[s] ?? Infinity)) continue; const at = T + HOUR; const p = st.pos[s];
        if(p){ const lq = agLiq(p); if(lq && k.o <= lq) agSell(s, k.o, 'liq', at, bf);
          else if(k.l <= p.sl){ agSell(s, Math.min(k.o, p.sl), p.sl >= p.entry ? 'be' : 'stop', at, bf); }
          else if(k.h >= p.tp){ agSell(s, Math.max(k.o, p.tp), 'tp', at, bf); }
          else { if(p.sl < p.entry && k.h >= p.entry + (p.entry - p.sl0)) p.sl = p.entry; if(at - p.at >= AG.timeStop) agSell(s, k.c, 'time', at, bf); } }
        if(i >= 60){ const win = c.slice(Math.max(0, i-250), i+1); win.push({t:T+HOUR, o:k.c, h:k.c, l:k.c, c:k.c, v:0}); const an = analyze(win);
          if(an){ if(st.pos[s]){ const sh = (an.cands||[]).find(x => x.side==='short' && x.rr >= 1.5 && x.score >= 2); if(sh) agSell(s, k.c, 'signal', at, bf); }
            else if(an.setup && an.setup.side==='long') agBuy(s, k.c, an.setup, an, at, bf); } }
        st.last[s] = T; }
      st.lastPx = Object.assign(st.lastPx||{}, px);
      const r = s => px[s] && st.base[s] ? px[s]/st.base[s] : null; const rs = AG.coins.map(r).filter(x => x != null);
      st.eq.push([T+HOUR, agEquity(st.lastPx), r('BTC') || (st.eq.length ? st.eq[st.eq.length-1][2] : 1), rs.length ? rs.reduce((a,b)=>a+b,0)/rs.length : 1]);
      if(++steps % 24 === 0) await sleep(0);
    }

    st.checked = Date.now(); agSave();

function agNotify(x){

}
function agLiveTick(){
  if(!agState || agBusy) return; const st = agState; let ch = false;
  Object.keys(st.pos).forEach(s => { const L = D.all[s], p = st.pos[s]; if(!L || !L.price || Date.now()-L.t > 60000) return; const x = L.price; st.lastPx[s] = x;
    const lq = agLiq(p); if(lq && x <= lq){ agSell(s, x, 'liq', Date.now(), false); ch = true; }
    else if(x <= p.sl){ agSell(s, x, p.sl >= p.entry ? 'be' : 'stop', Date.now(), false); ch = true; }
    else if(x >= p.tp){ agSell(s, x, 'tp', Date.now(), false); ch = true; }

function agLivePx(s){ const L = D.all[s]; return L && L.price && Date.now()-L.t < 90000 ? L.price : (agState && agState.lastPx && agState.lastPx[s]) || null; }

function agUpdateLive(){ const o = $('#ag-ov'); if(o) o.innerHTML = agOverview(); const h = $('#ag-hero'); if(h) h.innerHTML = agHero(); const p = $('#ag-pos'); if(p) p.innerHTML = agPosHTML(); const s = $('#ag-stats'); if(s) s.innerHTML = agStats(); }
function agRefreshUI(){ if(UI.route === 'agent' && !$('.modal')) renderView(); }

/* ---- intro: logo + name on every start, again when you come back after a while ---- */
(function(){
  const el = document.getElementById('intro'); if(!el) return; let hidAt = 0, tmr = 0;
  const finish = () => { el.classList.add('gone'); el.classList.remove('skip'); };
  const arm = ms => { clearTimeout(tmr); tmr = setTimeout(finish, ms); };
  el.addEventListener('click', () => { el.classList.add('skip'); arm(320); });
  arm(reduceMotion() ? 950 : 2300);
  window.playIntro = () => { const cur = document.getElementById('intro'); if(!cur) return; const c = cur.cloneNode(true); c.classList.remove('gone','skip'); cur.replaceWith(c); c.addEventListener('click', () => { c.classList.add('skip'); clearTimeout(tmr); tmr = setTimeout(() => c.classList.add('gone'), 320); }); clearTimeout(tmr); tmr = setTimeout(() => c.classList.add('gone'), reduceMotion() ? 950 : 2300); };
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') hidAt = Date.now(); else if(hidAt && Date.now() - hidAt > 10*60*1000){ hidAt = 0; window.playIntro(); } });
})();
/* =====================================================================
   BOOT
   ===================================================================== */
(function boot(){
  const nc = store.get('newsCache', null); if(nc && Array.isArray(nc.items)){ D.news = nc.items.map(tagItem); D.news.forEach(n => n.score = scoreNews(n, D.news)); D.newsAt = nc.at; }
  const sc = store.get('socialCache', null); if(sc && sc.trump){ D.social = {trump: sc.trump||[], reddit: sc.reddit||[]}; }
  applyTheme(); route(); connectLive(); scheduler(true); setTimeout(restPrices, 4000); setInterval(tick, 1000);
  setTimeout(() => loadCandles('BTC','4h').then(() => { if(UI.route==='home' && !$('.modal')) dataUpdated(); }).catch(()=>{}), 1500);
})();
</script>
